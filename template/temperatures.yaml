- sensor:
  - unique_id: outside_temperature
    name: Outside Temperature
    device_class: temperature
    state_class: measurement
    state: > 
      {{ states('sensor.ambweather_temp1') }}
    availability: > 
      {{ has_value('sensor.ambweather_temp1') }}
    unit_of_measurement: '°F'

- sensor:
  - unique_id: ffc879a1-37ef-4cf7-ad3d-9d32352827f8
    name: Outside Humidity
    device_class: humidity
    state_class: measurement
    state: > 
      {{ states('sensor.ambweather_humidity1') }}
    availability: >
      {{ has_value('sensor.ambweather_humidity1') }}
    unit_of_measurement: '%'

- sensor:
  - unique_id: house_temperature
    name: House Temperature
    device_class: temperature
    state_class: measurement
    state: > 
      {{ label_entities("house_climate") | select('has_value') | select('is_state_attr', 'device_class', 'temperature') | map('states') | map('float') | list | average }}
    availability: >
      {{ label_entities("house_climate") | select('has_value') | select('is_state_attr', 'device_class', 'temperature') | list | count > 0 }}
    unit_of_measurement: '°F'
