- sensor:
  - unique_id: house_humidity
    name: House Humidity
    device_class: humidity
    state_class: measurement
    state: > 
      {{ label_entities("house_climate") | select('has_value') | select('is_state_attr', 'device_class', 'humidity') | map('states') | map('float') | list | average }}
    availability: >
      {{ label_entities("house_climate") | select('has_value') | select('is_state_attr', 'device_class', 'humidity') | list | count > 0 }}
    unit_of_measurement: '%'

- binary_sensor:
  - unique_id: basement_humidity_high
    name: Basement Humidity High
    state: >
      {{ states('sensor.basement_cgdk2_humidity') | float > 60 }}
    availability: >
      {{ states('sensor.basement_cgdk2_humidity') | is_number }}
    device_class: moisture
