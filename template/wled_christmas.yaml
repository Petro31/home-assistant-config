- light:

    ########################################
    ###         Blinking Houses          ###
    ########################################
  
  - unique_id: christmas_blinking_houses
    name: Blinking Houses
    variables:
      wled: select.cabinet_accent_preset
    state: >
      {{- is_state(wled, 'Blinking Houses') }}
    availability: >
      {{- wled | has_value }}
    turn_on:
    - <<: &christmas_blinking_houses_target
        action: select.select_option
        target: 
          entity_id: select.cabinet_accent_preset
      data:
        option: Blinking Houses
    turn_off:
    - <<: *christmas_blinking_houses_target
      data:
        option: All Off

