# Board: ESPHome Starter Kit By Apollo (Apollo Automation)
# Definition: definitions/boards/apollo-esk-1/manifest.yaml

esphome:
  name: esphome-starter-kit
  friendly_name: esphome-starter-kit

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "qNpEI9PAInhX4LWoeryFDfw9eds+Lp9QXaHXQI8TVBs="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_iot_garage_ssid
  password: !secret wifi_iot_password
  ap:
    ssid: esphome-starter Fallback Hotspot
    password: "BYAfSq0qKYCi"

captive_portal:

switch:
  - platform: gpio
    id: accessory_power
    internal: true
    name: Accessory Power
    pin: 4
    restore_mode: ALWAYS_ON
    setup_priority: 2000

web_server:
  version: "3"

light:
  - platform: esp32_rmt_led_strip
    name: Onboard RGB LED
    pin: 5
    id: onboard_rgb_led
    chipset: WS2812
    num_leds: 1
    rgb_order: GRB
    rmt_symbols: 48
  - platform: esp32_rmt_led_strip
    name: RGB LEDs
    pin: 14
    id: rgb_leds
    chipset: WS2812
    num_leds: 10
    rgb_order: GRB
    rmt_symbols: 48

binary_sensor:
  - platform: gpio
    name: Button Module
    pin:
      inverted: true
      mode:
        input: true
        pullup: true
      number: 6
    id: button_module
    on_click:
      - then:
          - light.toggle: onboard_rgb_led
    on_double_click:
      - then:
          - light.toggle: rgb_leds
output:
  - platform: ledc
    pin: 18
    id: buzzer_output

rtttl:
  - output: buzzer_output
    id: rtttl_player

script:
  - id: play_the_simpsons
    mode: single
    then:
      - rtttl.play:
          id: rtttl_player
          rtttl: The Simpsons:d=4,o=5,b=160:c.,e,f#,8a,g.,e,c,8a4,8f#4,8f#4,8f#4,2g4,8p,8p,8f#4,8f#4,8f#4,8g4,a4.,8c,16p,8c,16p,8c,2c
  - id: play_mario
    mode: single
