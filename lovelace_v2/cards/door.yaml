# lovelace_gen
# A door, from door_buddy's last_opened sensor (the card's entity). Its
# 'source' attribute is the door (a binary_sensor or a cover): the icon and
# color show it open or closed. The secondary line is how long ago it was last
# opened (the sensor's timestamp), and under it the sensor's 'who'.
# Variables:
#   name, last_opened
#   door_type  door or garage
{%- set icons = {
  'door': ['mdi:door-open', 'mdi:door-closed'],
  'garage': ['mdi:garage-open-variant', 'mdi:garage-variant'],
}.get(door_type, ['mdi:power-on', 'mdi:power-off']) %}
{%- set is_open = "{%- set open = is_state(state_attr(entity, 'source'), ['on', 'open', 'opening', 'closing']) %}" %}
type: custom:mushroom-template-card
entity: {{ last_opened }}
primary: {{ name | tojson }}
icon: >-
  {{ is_open }}{% raw %}{%- set icons = {% endraw %}{{ icons | tojson }}{% raw %} %}
  {{- icons[0] if open else icons[1] }}{% endraw %}
color: >-
  {{ is_open }}{% raw %}{{ 'red' if open else 'disabled' }}{% endraw %}
secondary: >-
  {% raw %}{%- set when = as_datetime(states(entity), none) %}
  {%- set who = state_attr(entity, 'who') %}
  {{- time_since(when, 1) ~ ' ago' if when else 'Never opened' }}
  {%- if who %}{{ '\n' ~ who }}{% endif %}{% endraw %}
multiline_secondary: true
grid_options:
  columns: 6
