# lovelace_gen
# A square menu button for Home's grid, 4 per row, tapping navigates. Built on
# a Mushroom template card:
#   - with a picture: the picture fills the whole button (a UIX background,
#     scaled to cover; it may be an HA template, so live pictures update)
#   - without: the icon, centred
# Variables:
#   name, icon, navigation_path
#   image   optional picture (may be an HA template)
#   status  unused here (the Household window shows it)
{%- set square = "ha-card { aspect-ratio: 1 / 1; display: flex !important; flex-direction: column; justify-content: center; } " %}
{%- set card = {
  'type': 'custom:mushroom-template-card',
  'vertical': true,
  'tap_action': {'action': 'navigate', 'navigation_path': navigation_path},
  'grid_options': {'columns': 3, 'rows': 'auto'},
} %}
{%- if image %}
  {%- set card = dict(card, uix={'style': square
    ~ "ha-card { background: url(\"" ~ image ~ "\") center / cover no-repeat !important; }"}) %}
{%- else %}
  {%- set card = dict(card, icon=icon, uix={'style': square ~ ":host { --mush-icon-size: 56px; }"}) %}
{%- endif %}
{{ card | tojson }}
