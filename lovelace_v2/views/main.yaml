# lovelace_gen
# Builds the view list for the Home v2 dashboard from data/home.jinja.
#
# Includes take their variables as one JSON mapping:
#   - !include ['file.yaml', <the variables, a mapping piped through tojson>]
# JSON is valid YAML, so no indentation bookkeeping is needed. Macros return
# JSON too; decode it with fromjson.
{%- from '/config/lovelace_v2/data/home.jinja' import main_buttons, people, quick_actions, home_corner, count_rules, groups, home_sensors, household, house, home_remote, home_holiday %}
{%- set dashboard = '/ui-home-v2' %}

{#- A view path from a name: lowercase, spaces to underscores. #}
{%- macro slug(name) %}{{ name | lower | replace(' ', '_') }}{% endmacro %}

{#-
  Variables for cards/menu_icon.yaml (and the Household status lines): name,
  picture/icon, where it goes, and its status line (an HA template; see
  status() below).
#}
{%- macro button(item) %}
  {%- if item.legacy is defined %}
    {%- set target = '/ui-home/' ~ item.legacy %}
  {%- else %}
    {%- set target = dashboard ~ '/' ~ slug(item.name) %}
  {%- endif %}
  {%- set item_counts = counts(sources(item) | fromjson) | fromjson %}
  {{- {
    'name': item.name,
    'icon': item.icon,
    'image': item.image | default(''),
    'navigation_path': target,
    'status': status(item.status | default(''), item_counts, item.sensors | default([]),
                     item.idle | default('All off' if item_counts else '')) | fromjson,
  } | tojson }}
{%- endmacro %}

{#-
  A status line as an HA template string (JSON-encoded): 'status' when given;
  otherwise the sensors (rounded value + unit) then the counts ("3 lights
  on"), or 'idle' when there's nothing to show.
#}
{%- macro status(given, counts, sensors, idle) %}
  {%- if given %}
    {%- set tpl = given %}
  {%- elif counts or sensors %}
    {%- set tpl = "{%- set sensors = " ~ (sensors | tojson) ~ " %}"
      ~ "{%- set counts = " ~ (counts | tojson) ~ " %}"
      ~ "{%- set out = namespace(items=[]) %}"
      ~ "{%- for s in sensors if states(s) | is_number %}"
      ~ "{%- set out.items = out.items + [(states(s) | float | round(0) | int) ~ (state_attr(s, 'unit_of_measurement') or '')] %}"
      ~ "{%- endfor %}"
      ~ "{%- for c in counts %}"
      ~ "{%- set n = c.entities | select('is_state', c.state) | list | count %}"
      ~ "{%- if n %}{%- set out.items = out.items + [n ~ ' ' ~ (c.unit if n == 1 else c.units)] %}{%- endif %}"
      ~ "{%- endfor %}"
      ~ "{{ out.items | join(' · ') if out.items else " ~ (idle | tojson) ~ " }}" %}
  {%- else %}
    {%- set tpl = idle %}
  {%- endif %}
  {{- tpl | tojson }}
{%- endmacro %}

{#-
  Count sources of a main button or an area: a list of {'key', 'entities'},
  one per count group key it has (see count_rules). A menu button (Areas)
  gives its areas' sources.
#}
{%- macro sources(item) %}
  {%- set ns = namespace(out=[]) %}
  {%- if item.view is defined and item.view == 'menu' %}
    {%- for sub in item.entities %}
      {%- set ns.out = ns.out + (sources(sub) | fromjson) %}
    {%- endfor %}
  {%- else %}
    {%- for rule in count_rules %}
      {%- set m = namespace(ids=[]) %}
      {%- for g in groups(item, rule.key) | fromjson %}
        {%- set m.ids = m.ids + g.entities %}
      {%- endfor %}
      {%- if m.ids %}
        {%- set ns.out = ns.out + [{'key': rule.key, 'entities': m.ids}] %}
      {%- endif %}
    {%- endfor %}
  {%- endif %}
  {{- ns.out | tojson }}
{%- endmacro %}

{#-
  The counts for a list of sources: one {'entities', 'state', 'icon', 'color',
  'unit', 'units'} per rule in count_rules that any source has, with the
  entities it counts (each once).
#}
{%- macro counts(srcs) %}
  {%- set ns = namespace(counts=[]) %}
  {%- for rule in count_rules %}
    {%- set m = namespace(entities=[]) %}
    {%- for src in srcs if src.key == rule.key %}
      {%- for e in src.entities if e not in m.entities %}
        {%- set m.entities = m.entities + [e] %}
      {%- endfor %}
    {%- endfor %}
    {%- if m.entities %}
      {%- set ns.counts = ns.counts + [{'entities': m.entities, 'state': rule.state, 'icon': rule.icon, 'color': rule.color | default('amber'), 'unit': rule.unit, 'units': rule.units}] %}
    {%- endif %}
  {%- endfor %}
  {{- ns.counts | tojson }}
{%- endmacro %}


{#- Variables for cards/room.yaml (a Room Summary Card) for an area. #}
{%- macro room(area) %}
  {{- {
    'area': area,
    'navigation_path': dashboard ~ '/' ~ slug(area.name),
  } | tojson }}
{%- endmacro %}

{#-
  Home: quick actions and weather, people, the grid of picture buttons, then
  the Household window: status lines of the 'household' buttons and the
  recent activity log.
#}
{%- set home = namespace(icons=[], lines=[]) %}
{%- for item in main_buttons %}
  {%- set b = button(item) | fromjson %}
  {%- set home.icons = home.icons + [b] %}
  {%- if item.household is defined %}
    {%- set home.lines = home.lines + [{'icon': item.icon, 'name': item.name, 'status': b.status, 'quiet': item.household}] %}
  {%- endif %}
{%- endfor %}
{#- The path of the Home button with this name. #}
{%- macro page(name) %}{{ (home.icons | selectattr('name', 'equalto', name) | first).navigation_path }}{% endmacro %}

{#-
  Variables for cards/room.yaml for a summary card atop the Household window
  (the house, the remote): square, half width. Its 'links' (and its extras'
  'link') name Home buttons; they become those buttons' paths.
#}
{%- macro summary(area, navigation_path, options={}) %}
  {%- set links = namespace(map={}) %}
  {%- for key, name in (area.links | default({})).items() %}
    {%- set links.map = dict(links.map, **{key: page(name)}) %}
  {%- endfor %}
  {%- set extras = namespace(list=[]) %}
  {%- for e in area.extras | default([]) %}
    {%- set extras.list = extras.list + [dict(e, link=page(e.link)) if e is mapping and e.link is defined else e] %}
  {%- endfor %}
  {{- {'area': dict(area, links=links.map, extras=extras.list), 'navigation_path': navigation_path, 'card_options': dict({
    'grid_options': {'columns': 6, 'rows': 'auto'},
    'icon_opacity_preset': 'high_visibility',
    'styles': {'card': {'--user-grid-aspect-ratio': '1/1'}},
  }, **options)} | tojson }}
{%- endmacro %}
- !include ['menu.yaml', {{ {
    'name': 'Home', 'icon': 'mdi:home', 'path': 'home',
    'actions': quick_actions, 'corner': home_corner, 'people': people,
    'icons': home.icons,
    'household': dict(household, lines=home.lines),
    'summaries': [
      summary(house, dashboard ~ '/areas', {
        'uix': {'style': {'room-background-image $ hui-image $': 'img { object-position: center 75% !important; }'}},
      }) | fromjson,
      summary(home_remote, page(home_remote.page)) | fromjson,
      summary(home_holiday, page(home_holiday.page)) | fromjson,
    ],
  } | tojson }}]

{#- One view per main button that has been ported to v2. #}
{%- for item in main_buttons if item.view is defined %}
  {%- set path = slug(item.name) %}
  {%- if item.view == 'menu' %}
    {%- set sub = namespace(rooms=[]) %}
    {%- for area in item.entities %}
      {%- set sub.rooms = sub.rooms + [room(area) | fromjson] %}
    {%- endfor %}
- !include ['menu.yaml', {{ {
    'name': item.name, 'icon': item.icon, 'path': path, 'back_path': dashboard ~ '/home',
    'rooms': sub.rooms,
  } | tojson }}]
    {%- for area in item.entities %}
- !include ['area.yaml', {{ {
    'name': area.name, 'icon': area.icon, 'path': slug(area.name), 'back_path': dashboard ~ '/' ~ path,
    'area': area,
  } | tojson }}]
    {%- endfor %}
  {%- else %}
- !include ['{{ item.view }}.yaml', {{ {
    'name': item.name, 'icon': item.icon, 'path': path, 'back_path': dashboard ~ '/home',
    'entities': item.entities | default([]), 'controls': item.controls | default([]),
  } | tojson }}]
  {%- endif %}
{%- endfor %}
