# lovelace_gen
# The Laundry subview: a copy of the legacy Laundry view
# (lovelace/views/laundry.yaml) without its header row (the legacy back
# button); the subview's back arrow returns to Home. Washer: its tiles, a
# 3-hour history graph and its cycle log; Dryer: its status, then its power
# (named without its device), and its history graph.
# Variables:
#   name, icon, path, back_path (no badges)
title: {{ name | tojson }}
path: {{ path }}
icon: {{ icon }}
type: sections
subview: true
back_path: {{ back_path }}
sections:
  - type: grid
    cards:
      - type: tile
        entity: binary_sensor.washer
      - type: tile
        entity: sensor.washer_power
      - type: tile
        entity: binary_sensor.washer_status
      - type: tile
        name: Reset Cycles
        entity: script.reset_washer
      - type: history-graph
        entities:
          - entity: binary_sensor.washer
          - entity: sensor.washer_power
        hours_to_show: 3
      - type: custom:auto-entities
        filter:
          template: |-
            {% raw %}
            {% from 'easy_time.jinja' import easy_relative_time %}
            {% set cycles = state_attr('binary_sensor.washer', 'cycles') %}
            {% if cycles | length > 0 %}
              [{% for e in state_attr('binary_sensor.washer', 'cycles') %}
                {% set icon = 'mdi:' ~ ('motion-play-outline' if e.action == 'spinning' else 'motion-pause-outline') %}
                {% set color = 'blue' if e.action == 'spinning' else 'grey' %}
                {% set dt = easy_relative_time(e.start) | title %}
                {{
                  dict(
                    type='custom:mushroom-template-card',
                    primary=e.action | title,
                    secondary=dt,
                    icon=icon,
                    icon_color=color,
                  )
                }},
              {% endfor %}]
            {% else %}
              [{{ dict(
                    type='custom:mushroom-template-card',
                    primary='idle' | title,
                    icon='mdi:motion-pause-outline',
                    icon_color='grey',
                  ) }}]
            {% endif %}
            {% endraw %}
        card_param: cards
        card:
          type: vertical-stack
    title: Washer
  - type: grid
    cards:
      - type: tile
        entity: binary_sensor.dryer_status
      # Its entity name only, not its device's (Washer and Dryer Channel 2).
      - type: tile
        entity: sensor.dryer_power
        name:
        - type: entity
      - type: history-graph
        entities:
          - entity: binary_sensor.dryer_status
          - entity: sensor.dryer_power
        hours_to_show: 3
    title: Dryer
