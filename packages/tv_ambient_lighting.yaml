# Controls the Hyperion TV backlight: an effect select and a brightness
# number that read and set the light directly, and switches for screen
# mimicking and a few preset effects.
#
# External entities used:
#   Hyperion (hyperion)
#     No area: GPIO 18 - TV Living Room (a46cd8f50bb07319af3910f654b034f3)
#       light.gpio_18_tv
#       switch.gpio_18_tv_component_led_device
#       switch.gpio_18_tv_component_usb_capture
#
# Entities created by this package:
#   select.hyperion_effects
#   number.hyperion_brightness
#   switch.hyperion
#   switch.hyperion_usb_capture
#   switch.hyperion_cinema
#   switch.hyperion_rainbow_swirl_fast
#   switch.hyperion_solid_green

template:
- select:
  # The light's current effect; picking one turns the light on with it.
  - unique_id: hyperion_effects
    name: Hyperion Effects
    default_entity_id: select.hyperion_effects
    icon: mdi:looks
    state: "{{ state_attr('light.gpio_18_tv', 'effect') }}"
    options: "{{ state_attr('light.gpio_18_tv', 'effect_list') or [] }}"
    select_option:
    - action: light.turn_on
      target:
        entity_id: light.gpio_18_tv
      data:
        effect: "{{ option }}"

- number:
  # The light's brightness in percent; setting it turns the light on.
  - unique_id: hyperion_brightness
    name: Hyperion Brightness
    default_entity_id: number.hyperion_brightness
    icon: mdi:white-balance-sunny
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 1
    state: >
      {%- set brightness = state_attr('light.gpio_18_tv', 'brightness') %}
      {{ (brightness / 255 * 100) | round(0) if brightness is number else 0 }}
    set_value:
    - action: light.turn_on
      target:
        entity_id: light.gpio_18_tv
      data:
        brightness_pct: "{{ value }}"

- switch:
  - unique_id: hyperion
    name: Hyperion
    default_entity_id: switch.hyperion
    state: >
      {%- set entities = 'switch.gpio_18_tv_component_led_device', 'switch.gpio_18_tv_component_usb_capture' %}
      {{ entities | select('is_state', 'on') | list | count == 2 }}
    turn_on:
    - action: switch.turn_on
      target:
        entity_id: 
        - switch.gpio_18_tv_component_led_device
        - switch.gpio_18_tv_component_usb_capture
    turn_off:
    - action: switch.turn_off
      target:
        entity_id: 
        - switch.gpio_18_tv_component_led_device
        - switch.gpio_18_tv_component_usb_capture
  
  - unique_id: hyperion_usb_capture
    default_entity_id: switch.hyperion_usb_capture
    state: >
      {%- set entities = 'switch.gpio_18_tv_component_led_device', 'switch.gpio_18_tv_component_usb_capture' %}
      {{ entities | select('is_state', 'on') | list | count == 2 }}
    turn_on:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.gpio_18_tv_component_led_device
        - switch.gpio_18_tv_component_usb_capture
    turn_off:
    - action: homeassistant.turn_off
      target:
        entity_id: 
        - switch.gpio_18_tv_component_led_device
        - switch.gpio_18_tv_component_usb_capture
  
  - unique_id: hyperion_cinema
    default_entity_id: switch.hyperion_cinema
    state: >
      {%- set entity = 'light.gpio_18_tv' %}
      {{ is_state(entity, 'on') and is_state_attr(entity, 'effect', 'Cinema dim lights') }}
    turn_on:
    - action: switch.turn_on
      target:
        entity_id: switch.gpio_18_tv_component_led_device
    - action: light.turn_on
      target:
        entity_id: light.gpio_18_tv
      data:
        brightness: 255
        effect: Cinema dim lights
    turn_off:
    - action: homeassistant.turn_off
      target:
        entity_id:
        - light.gpio_18_tv
        - switch.gpio_18_tv_component_led_device
  
  - unique_id: hyperion_rainbow_swirl_fast
    default_entity_id: switch.hyperion_rainbow_swirl_fast
    state: >
      {%- set entity = 'light.gpio_18_tv' %}
      {{ is_state(entity, 'on') and is_state_attr(entity, 'effect', 'Rainbow swirl fast') }}
    turn_on:
    - action: switch.turn_on
      target:
        entity_id: switch.gpio_18_tv_component_led_device
    - action: light.turn_on
      target:
        entity_id: light.gpio_18_tv
      data:
        brightness: 255
        effect: Rainbow swirl fast
    turn_off:
    - action: homeassistant.turn_off
      target:
        entity_id:
        - light.gpio_18_tv
        - switch.gpio_18_tv_component_led_device
  
  - unique_id: hyperion_solid_green
    default_entity_id: switch.hyperion_solid_green
    state: >
      {%- set entity = 'light.gpio_18_tv' %}
      {%- set is_solid = is_state_attr(entity, 'effect', 'Solid') %}
      {%- set is_green = is_state_attr(entity, 'rgb_color', (0, 255, 0)) %}
      {{ is_state(entity, 'on') and is_solid and is_green }}
    turn_on:
    - action: switch.turn_on
      target:
        entity_id: switch.gpio_18_tv_component_led_device
    - action: light.turn_on
      target:
        entity_id: light.gpio_18_tv
      data:
        brightness: 255
        rgb_color: [0, 255, 0]
    turn_off:
    - action: homeassistant.turn_off
      target:
        entity_id:
        - light.gpio_18_tv
        - switch.gpio_18_tv_component_led_device
  
