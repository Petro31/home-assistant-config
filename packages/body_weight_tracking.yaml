# Body weight tracking: assigns each new reading from the bathroom scale to the
# person whose last weight is within 20 lb of it, and publishes it as that
# person's weight sensor through MQTT (created at startup).
#
# External entities used:
#   Person (person, UI)
#     person.lambo
#     person.petro
#   Xiaomi BLE (xiaomi_ble)
#     Master Bathroom: Mi Body Composition Scale (6E52) (d9cb21cd0a9c29ee538eabc7b43165e2)
#       sensor.mi_body_composition_scale_6e52_mass
#   packages/shared/mqtt_discovery_helpers.yaml
#     script.mqtt_automated_config
#     script.mqtt_automated_states
#
# Entities created by this package:
#   sensor.lambo_weight (through MQTT discovery)
#   sensor.petro_weight (through MQTT discovery)

automation:
- alias: MQTT Discovery and Automation
  id: mqtt_store_and_automate_weights
  mode: parallel
  triggers:
    - id: start
      trigger: homeassistant
      event: start
    - id: new
      trigger: state
      entity_id: sensor.mi_body_composition_scale_6e52_mass
  variables:
    root: "homeassistant"
    range: 20
    config:
      - person: person.petro
        initial: 200
      - person: person.lambo
        initial: 145
    people: >
      {%- set ns = namespace(items=[]) %}
      {%- for item in config %}
        {%- set object_id = item.person.split('.')[-1] ~ '_weight' %}
        {%- set ns.items = ns.items + [{
            'unique_id': object_id,
            'object_id': object_id,
            'initial': item.initial,
            'current': states('sensor.' ~ object_id) | float(None),
        }] %}
      {%- endfor %}
      {{ ns.items }}
    weight: >
      {%- if trigger.id == 'new' and trigger.to_state.state | is_number %}
        {%- set next_weight = trigger.to_state.state | float %}
        {%- set ns = namespace(items=[]) %}
        {%- for person in people %}
          {%- set current = person.current or person.initial %}
          {%- if current - range <= next_weight <= current + range %}
            {%- set ns.items = ns.items + [{'next':next_weight, 'unique_id':person.unique_id}] %}
          {%- endif %}
        {%- endfor %}
        {{ ns.items | first | default }}
      {%- else -%}
        None
      {%- endif %}
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'start' }}"
      sequence:
      - repeat:
          for_each: "{{ people }}"
          sequence:
          - action: script.mqtt_automated_config
            data:
              domain: sensor
              unique_id: "{{ repeat.item.unique_id }}"
              object_id: "{{ repeat.item.object_id }}"
              state_class: measurement
              device_class: weight
              unit_of_measurement: lb

    - conditions: "{{ weight is not none }}"
      sequence:
      - action: script.mqtt_automated_states
        data:
          domain: sensor
          unique_id: "{{ weight.unique_id }}"
          state: "{{ weight.next }}"
