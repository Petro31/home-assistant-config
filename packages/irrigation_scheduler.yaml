# Irrigation scheduling: waters each Rain Bird zone every N days (set per
# yard) at the program start time, one zone after another. When the rain
# sensor is wet, it skips watering and logs the rain as the zone's last run.
# Also reminds when to open or close the irrigation shutoff valve before the
# season starts and ends.
#
# External entities used:
#   Rain Bird (rainbird)
#     Zone switches are found with integration_entities('rainbird'); the
#     disabled zones 4, 9 and 10 are not picked up.
#     Back Yard: Rain Bird Sprinkler 5 (e48ba07b21b58726a78b3bb3bab1f5dc)
#       switch.rain_bird_sprinkler_5
#     Back Yard: Rain Bird Sprinkler 6 (c95a506d493130de2ea735dbdd76b382)
#       switch.rain_bird_sprinkler_6
#     Back Yard: Rain Bird Sprinkler 7 (457c972910bf885a2918b5ff621b7af3)
#       switch.rain_bird_sprinkler_7
#     Front Yard: Rain Bird Sprinkler 1 (6182aab27b9f1a813e8a5b72468fa122)
#       switch.rain_bird_sprinkler_1
#     Front Yard: Rain Bird Sprinkler 2 (c898903bd152f9ec618f14019922912c)
#       switch.rain_bird_sprinkler_2
#     Front Yard: Rain Bird Sprinkler 3 (5113b9b496763fa31ccbaa405a9b6db8)
#       switch.rain_bird_sprinkler_3
#     Front Yard: Rain Bird Sprinkler 8 (62a3250ec122fe6664baa391b573889e)
#       switch.rain_bird_sprinkler_8
#     Server Room: Rain Bird Controller (5fcf5910f4eb6cac3d9c4712e9076a9f)
#       binary_sensor.rain_bird_controller_rainsensor
#   Date/Time helper (input_datetime, UI)
#     input_datetime.irrigation_program_start
#   scripts/mqtt.yaml
#     script.mqtt_automated_config
#     script.mqtt_automated_states
#   scripts/notifiers.yaml
#     script.notify
#
# Entities created by this package:
#   binary_sensor.irrigation_season
#   sensor.irrigation_season_start
#   sensor.irrigation_season_end
#   script.irrigation_mqtt_discovery
#   script.get_next_irrigations
#   script.set_last_irrigation
#   Through MQTT discovery (script.irrigation_mqtt_discovery), MQTT (mqtt):
#     Back Yard: Sprinkler Cycle (386be5b6a4e15369134aded5727e04af)
#       number.back_yard_day_cycle
#       switch.back_yard_status
#     Front Yard: Sprinkler Cycle (2c04f14876d3d022d8c44a3dbfaa56d2)
#       number.front_yard_day_cycle
#       switch.front_yard_status
#     Back Yard: Rain Bird Sprinkler 5 (0f6aa46b835c6ae0f1b83ff04ac8e5bc)
#       sensor.rain_bird_sprinkler_5_start
#       sensor.rain_bird_sprinkler_5_last_run
#       number.rain_bird_sprinkler_5_program_duration
#       switch.rain_bird_sprinkler_5_status
#     Back Yard: Rain Bird Sprinkler 6 (74f16d37948f926d1f224d499cc4d87e)
#       sensor.rain_bird_sprinkler_6_start
#       sensor.rain_bird_sprinkler_6_last_run
#       number.rain_bird_sprinkler_6_program_duration
#       switch.rain_bird_sprinkler_6_status
#     Back Yard: Rain Bird Sprinkler 7 (3d295816c50e11a163895a0a5d38456b)
#       sensor.rain_bird_sprinkler_7_start
#       sensor.rain_bird_sprinkler_7_last_run
#       number.rain_bird_sprinkler_7_program_duration
#       switch.rain_bird_sprinkler_7_status
#     Front Yard: Rain Bird Sprinkler 1 (73b99041317d5277a46a68219a584a82)
#       sensor.rain_bird_sprinkler_1_start
#       sensor.rain_bird_sprinkler_1_last_run
#       number.rain_bird_sprinkler_1_program_duration
#       switch.rain_bird_sprinkler_1_status
#     Front Yard: Rain Bird Sprinkler 2 (013cf237b29b3e3b1e48f8d4a222c0f0)
#       sensor.rain_bird_sprinkler_2_start
#       sensor.rain_bird_sprinkler_2_last_run
#       number.rain_bird_sprinkler_2_program_duration
#       switch.rain_bird_sprinkler_2_status
#     Front Yard: Rain Bird Sprinkler 3 (e2d32624e5923f2802f578935eb140d4)
#       sensor.rain_bird_sprinkler_3_start
#       sensor.rain_bird_sprinkler_3_last_run
#       number.rain_bird_sprinkler_3_program_duration
#       switch.rain_bird_sprinkler_3_status
#     Front Yard: Rain Bird Sprinkler 8 (24b9eb403e012e452f727cdf2638710f)
#       sensor.rain_bird_sprinkler_8_start
#       sensor.rain_bird_sprinkler_8_last_run
#       number.rain_bird_sprinkler_8_program_duration
#       switch.rain_bird_sprinkler_8_status

automation:
- alias: MQTT Discovery
  id: aafa91b8-a2e2-4df2-9412-536288327566
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  actions:

  # MQTT Discovery
  - action: script.turn_on
    target:
      entity_id: script.irrigation_mqtt_discovery

- alias: Set Next Irrigation
  id: 54f20352-b2ba-44d7-80f5-44ada2469dbc
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "00:00:00"
    - trigger: state
      entity_id:
      - input_datetime.irrigation_program_start
      - switch.back_yard_status
      - switch.front_yard_status
      - number.back_yard_day_cycle
      - number.front_yard_day_cycle
      - switch.rain_bird_sprinkler_1_status
      - switch.rain_bird_sprinkler_2_status
      - switch.rain_bird_sprinkler_3_status
      - switch.rain_bird_sprinkler_5_status
      - switch.rain_bird_sprinkler_6_status
      - switch.rain_bird_sprinkler_7_status
      - switch.rain_bird_sprinkler_8_status
      - number.rain_bird_sprinkler_1_program_duration
      - number.rain_bird_sprinkler_2_program_duration
      - number.rain_bird_sprinkler_3_program_duration
      - number.rain_bird_sprinkler_5_program_duration
      - number.rain_bird_sprinkler_6_program_duration
      - number.rain_bird_sprinkler_7_program_duration
      - number.rain_bird_sprinkler_8_program_duration
  actions: 
  - action: script.get_next_irrigations
    response_variable: irrigations
  - condition: template
    value_template: "{{ irrigations.zones | count > 0 }}"
  - repeat:
      for_each: "{{ irrigations.zones }}"
      sequence:
      - action: script.mqtt_automated_states
        data:
          domain: sensor
          unique_id: "{{ repeat.item.zone_next_run_id }}"
          state: "{{ repeat.item.zone_next_run }}"

- alias: Start Irrigation Cycle
  id: 1c67152d-d153-41a9-b5a7-78ce036fecbf
  mode: single
  triggers:
  - trigger: time
    at: &entities
    - sensor.rain_bird_sprinkler_1_start
    - sensor.rain_bird_sprinkler_2_start
    - sensor.rain_bird_sprinkler_3_start
    - sensor.rain_bird_sprinkler_5_start
    - sensor.rain_bird_sprinkler_6_start
    - sensor.rain_bird_sprinkler_7_start
    - sensor.rain_bird_sprinkler_8_start
  variables:
    entities: *entities

    # Ensure we have an isoformatted utc timestamp that matches the most recent minute.
    trigger_time: >
      {{ trigger.now.astimezone(utcnow().tzinfo).replace(second=0, microsecond=0).isoformat() }}

    start: >
      {{ entities | select('is_state', trigger_time) | first | default }}

    object_id: >
      {{ start | regex_findall('sensor.(.*)_start') | first }}

    switch: switch.{{ object_id }}
    number: number.{{ object_id }}_program_duration
    last_run_unique_id: >
      {% set identifier = device_attr('sensor.{0}_last_run'.format(object_id), 'identifiers') | list | first | last %}
      {{ identifier | slugify | replace('_', '') ~ 'lr' }}
    last_run_attributes: >
      {{ dict(by='irrigation' if is_state('binary_sensor.rain_bird_controller_rainsensor', 'off') else 'rain') }}

    # Default to zero for if checks when failing
    duration: >
      {{ states(number) | int(0) }}

  conditions:
  - condition: template
    value_template: "{{ duration > 0 }}"
  actions:
  - action: script.mqtt_automated_states
    data:
      domain: sensor
      unique_id: "{{ last_run_unique_id }}"
      state: "{{ trigger_time }}"
      attributes: "{{ last_run_attributes }}"
  - if: "{{ is_state('binary_sensor.rain_bird_controller_rainsensor', 'off') }}"
    then:
    - action: rainbird.start_irrigation
      data:
        entity_id: "{{ switch }}"
        duration: "{{ duration }}"

- alias: Check Rain Today
  id: a9040111-cd2f-4dd4-9a6b-518bfa2e90e9
  mode: restart
  triggers:
    - trigger: time
      at:
      - entity_id: input_datetime.irrigation_program_start
        offset: "-00:01:00"
  variables:
    trigger_time: >
      {{ trigger.now.astimezone(utcnow().tzinfo).replace(second=0, microsecond=0).isoformat() }}
  conditions:
  - condition: state
    entity_id: binary_sensor.rain_bird_controller_rainsensor
    state: 'on'
  - condition: state
    entity_id: binary_sensor.irrigation_season
    state: 'on'
  actions:
  - action: script.set_last_irrigation
    data:
      time: "{{ (trigger_time | as_datetime).time() }}"
      date: "{{ (trigger_time | as_datetime).date() }}"
      switches: "{{ integration_entities('rainbird') | select('match', '^switch.') | list }}"
      reason: rain


- alias: Valve Reminders
  id: 33596fc1-7dbf-4837-a589-953f2d5d072a
  triggers:
    - trigger: time
      at: '10:00:00'
    - trigger: time
      at: '15:30:00'
    - trigger: time
      at: '19:00:00'
  variables:
    target_dates: >
      {% set ns = namespace(dates=[]) %}
      {%- for offset in [7, 1] %}
      {%- set ns.dates = ns.dates + [(today_at() + timedelta(days=offset)).date() | string] %}
      {%- endfor %}
      {{ ns.dates }}
    entities:
    - sensor.irrigation_season_start
    - sensor.irrigation_season_end
    events: >
      {%- from 'easy_time.jinja' import speak_the_days %}
      {%- set phrase = 'Turn o{} the water irrigation shutoff value{}{}' %}
      {%- set ns = namespace(items=[]) %}
      {%- for e in entities %}
        {%- set dt = states(e) | as_datetime %}
        {%- set date = dt.date() | string %}
        {%- set name = e | entity_name %}
        {%- set p = 'n' if 'Start' in name else 'ff' %}
        {%- set f = speak_the_days(dt) %}
        {%- set m = ' ' if 'in' in f else ' before ' %}
        {%- set ns.items = ns.items + [
          dict(
            title=name,
            when=date,
            message=phrase.format(p, m, f)
          )
        ] -%}
      {%- endfor %}
      {{ ns.items }}
    event: >
      {{ events | selectattr('when', 'in', target_dates) | list | first | default(None) }}
  conditions:
  - condition: template
    value_template: "{{ event is not none }}"
  actions:
  - action: script.notify
    data:
      title: "{{ event.title }}"
      message: "{{ event.message }}"

script:
  irrigation_mqtt_discovery:
    alias: MQTT Discovery
    mode: single
    variables:
      root: "homeassistant"
      sprinklers: >
        {%- set ns = namespace(items=[]) %}
        {%- for e in integration_entities('rainbird') | select('match', '^switch.') %}
          {%- set identifier = device_attr(e, 'identifiers') | list | first | last %}
          {%- set ns.items = ns.items + [
              dict(
                  entity_id=e,
                  identifier=identifier,
                  object_id=e.split('.')[-1],
                  name=device_attr(e, 'name'),
                  manufacturer=device_attr(e, 'manufacturer')
              ) ] %}
        {%- endfor %}
        {{- ns.items }}
      area_ids: >
        {{ integration_entities('rainbird') | select('match', '^switch.') | map('area_id') | unique | list }}
    sequence:

      # Setup Cycle Devices
      - repeat:
          for_each: "{{ area_ids }}"
          sequence:

          - variables:
              unique_id: "{{ repeat.item | slugify }}"
              object_id: "{{ unique_id }}"
              device: 
                name: "{{ area_name(repeat.item) }} Sprinker Cycle"
                identifiers:
                - "{{ unique_id }}"
                manufacturer: Petro

          # Day Cycle Slider
          - action: mqtt.publish
            data: >
              {%- set domain = 'number' %}
              {%- set this_id = 'ds' %}
              {%- set topic = root ~ '/' ~ domain ~ '/' ~ unique_id ~ this_id ~ '/' %}
              {{ {
                  'topic': topic ~ 'config',
                  'payload': {
                      'name': 'Day Cycle',
                      'unique_id': unique_id ~ this_id,
                      'default_entity_id': domain ~ '.' ~ object_id ~ '_day_cycle',
                      'state_topic': topic ~ 'state',
                      'command_topic': topic ~ 'state',
                      'command_template': "{{ value }}",
                      'min': 1,
                      'max': 10,
                      'unit_of_measurement': 'days',
                      'device': device,
                      'retain': True,
                    } | to_json,
                  'retain': True,
              } }}

          # enable/disable toggles.
          - action: mqtt.publish
            data: >
              {%- set domain = 'switch' %}
              {%- set this_id = 'sw' %}
              {%- set topic = root ~ '/' ~ domain ~ '/' ~ unique_id ~ this_id ~ '/' %}
              {{ {
                  'topic': topic ~ 'config',
                  'payload': {
                      'name': 'Status',
                      'unique_id': unique_id ~ this_id,
                      'default_entity_id': domain ~ '.' ~ object_id ~ '_status',
                      'state_topic': topic ~ 'state',
                      'command_topic': topic ~ 'state',
                      'device': device,
                      'retain': True,
                    } | to_json,
                  'retain': True,
              } }}

      # Zones
      - repeat:
          for_each: "{{ sprinklers }}"
          sequence:
          - variables:
              object_id: "{{ repeat.item.object_id }}"
              unique_id: "{{ repeat.item.identifier | slugify | replace('_', '') }}"
              device: 
                name: "{{ repeat.item.name }}"
                identifiers:
                - "{{ repeat.item.identifier }}"
                manufacturer: Petro

          # Create Program Next Start Timestamp sensors
          - action: script.mqtt_automated_config
            data:
              name: Start
              domain: sensor
              object_id: "{{ object_id }}_start"
              unique_id: "{{ unique_id }}ts"
              device_class: timestamp
              device: "{{ device }}"

          # Create Program Last Ran Timestamp sensors
          - action: script.mqtt_automated_config
            data:
              name: Last Run
              domain: sensor
              object_id: "{{ object_id }}_last_run"
              unique_id: "{{ unique_id }}lr"
              device_class: timestamp
              device: "{{ device }}"

          # Create Program Duration numbers
          - action: mqtt.publish
            data: >
              {%- set domain = 'number' %}
              {%- set this_id = 'pd' %}
              {%- set topic = root ~ '/' ~ domain ~ '/' ~ unique_id ~ this_id ~ '/' %}
              {{ {
                  'topic': topic ~ 'config',
                  'payload': {
                      'name': 'Program Duration',
                      'unique_id': unique_id ~ this_id,
                      'default_entity_id': domain ~ '.' ~  object_id ~ '_program_duration',
                      'state_topic': topic ~ 'state',
                      'command_topic': topic ~ 'state',
                      'command_template': "{{ value }}",
                      'min': 1,
                      'max': 20,
                      'unit_of_measurement': 'minutes',
                      'device': device,
                      'retain': True,
                    } | to_json,
                  'retain': True,
              } }}

          # Create enable/disable toggles.
          - action: mqtt.publish
            data: >
              {%- set domain = 'switch' %}
              {%- set this_id = 'sw' %}
              {%- set topic = root ~ '/' ~ domain ~ '/' ~ unique_id ~ this_id ~ '/' %}
              {{ {
                  'topic': topic ~ 'config',
                  'payload': {
                      'name': 'Status',
                      'unique_id': unique_id ~ this_id,
                      'default_entity_id': domain ~ '.' ~ object_id ~ '_status',
                      'state_topic': topic ~ 'state',
                      'command_topic': topic ~ 'state',
                      'device': device,
                      'retain': True,
                    } | to_json,
                  'retain': True,
              } }}


  get_next_irrigations:
    alias: Get Next Irrigation
    mode: single
    trace:
      stored_traces: 15
    variables:
      targets: >
        {#- Generate a list of targets for the schedule #}
        {%- set ns = namespace(items=[]) %}
        {%- set entities = integration_entities('rainbird') | select('match', '^switch.') | sort %}
        {%- for e in entities %}
          {%- set object_id = e.split('.')[-1] %}
          {%- if states('sensor.{0}_last_run'.format(object_id)) | as_datetime(None) is not none %}
            {%- set ns.items = ns.items + [e] %}
          {%- endif %}
        {%- endfor %}
        {#- if they are all available, output them all.  Otherwise output nothing. #}
        {#- This was done because at startup, we would execute this many times when each switch from MQTT would go from unavailable to available. #}
        {%- if entities | count == ns.items | count %}
          {{ ns.items }}
        {%- else %}
          {{ [] }}
        {%- endif %}

      schedule: >
        {%- set season_start = states('sensor.irrigation_season_start') | as_datetime(None) %}
        {%- set end_entity = states('sensor.irrigation_season_end') | as_datetime(None) %}
        {%- if targets and start_entity is not none and end_entity is not none %}
          {%- set season_start = (season_start | as_local).date() | string %}
          {%- set season_end = (end_entity | as_local).date() | string %}
          {%- set this_date = now().date() | string %}
          {%- set ns = namespace(items=[], programs=[], next_runs=[]) %}
          {%- set start = states('input_datetime.irrigation_program_start') %}
          {%- for e in targets %}

            {# program #}
            {%- set program_area = e | area_id %}
            {%- set program_cycle = states('number.{0}_day_cycle'.format(program_area)) | int %}
            {%- set program_status = is_state('switch.{0}_status'.format(program_area), 'on') %}

            {# zones #}
            {%- set object_id = e.split('.')[-1] %}
            {%- set zone_duration = states('number.{0}_program_duration'.format(object_id)) | int %}
            {%- set zone_last_run = (states('sensor.{0}_last_run'.format(object_id)) | as_datetime | as_local).date() | string %}
            {%- set zone_status = is_state('switch.{0}_status'.format(object_id), 'on') %}
            {%- set zone_identifier = device_attr('sensor.{0}_start'.format(object_id), 'identifiers') | list | first | last %}

            {# Add cycle days to last_run date, then attach the time of day if the switch is enabled. #}

            {# Create a list of namespaces to increment minutes for each date #}
            {%- set next_run_day = (zone_last_run | as_datetime + timedelta(days=program_cycle)).date() | string %}
            {%- if next_run_day < this_date %}
              {%- set next_run_day = this_date %}
            {%- endif %}
            
            {%- set next_runs = ns.next_runs | selectattr('date', 'eq', next_run_day) | first | default(None) %}
            {%- if next_runs is none %}
              {%- set next_runs = namespace(date=next_run_day, minutes=0) %}
              {%- set ns.next_runs = ns.next_runs + [next_runs] %}
            {%- endif %}

            {%- set next_runs.minutes = ns.items | selectattr('date', 'eq', next_run_day) | selectattr('program_status', 'eq', True) | selectattr('zone_status', 'eq', True) | map(attribute='zone_duration') | sum %}
            {%- set next_run = (next_run_day ~ ' ' ~ start) | as_datetime | as_local %}

            {%- set ns.items = ns.items + [
              dict(
                area_id=program_area,
                object_id=object_id,
                program_cycle=program_cycle,
                program_status=program_status,
                zone_duration=zone_duration,
                zone_last_run=zone_last_run,
                zone_next_run_id=zone_identifier | slugify | replace('_', '') ~ 'ts',
                zone_next_run=(next_run + timedelta(minutes=next_runs.minutes)).isoformat(),
                zone_status=zone_status,
                date=next_run_day
              )
            ] %}
          {%- endfor %}
          {{- dict(
              zones=ns.items | rejectattr('date', '<', season_start) | rejectattr('date', '>=', season_end) | list
          ) -}}
        {%- else %}
          {{ dict(zones=[]) }}
        {%- endif %}
    sequence:
    - stop: "Stop"
      response_variable: schedule


  set_last_irrigation:
    alias: Set Last Irrigation
    mode: queued
    fields: 
      time:
        description: Time when the irrigation will start.
        required: True
        selector:
          time:
      date:
        description: Date when the irrigation will start.
        required: True
        selector:
          date:
      switches:
        description: List of entities used in the irrigation 
        required: True
        selector:
          entity:
            multiple: True
            filter:
            - integration: rainbird
              domain: switch
      reason:
        description: Did it rain or did we water?
        required: True
        selector:
          select:
            options:
            - label: Rain
              value: rain
            - label: Irrigation
              value: irrigation
    variables:
      sprinklers: >
        {# maps timestamp entity_id to the unique_id created in script.irrigation_mqtt_discovery #}
        {% set t = (date ~ ' ' ~ time) | as_datetime | as_local %}
        {%- set ns = namespace(items=[]) %}
        {%- for e in switches %}
          {%- set identifier = device_attr(e, 'identifiers') | list | first | last %}
          {%- set object_id = e.split('.') | last %}
          {%- set minutes = ns.items | map(attribute='duration') | sum %}
          {%- set data = dict(
            id=identifier | slugify | replace('_', '') ~ 'lr',
            duration=states('number.{0}_program_duration'.format(object_id)) | float(0),
            datetime=(t + timedelta(minutes=minutes)).isoformat(),
          ) -%}
          {%- set ns.items = ns.items + [ data ] %}
        {%- endfor %}
        {{- ns.items }}
    sequence:
    - repeat:
        for_each: "{{ sprinklers }}"
        sequence:
        - action: script.mqtt_automated_states
          data:
            domain: sensor
            unique_id: "{{ repeat.item.id }}"
            state: "{{ repeat.item.datetime }}"
            attributes: "{{ dict(by=reason) }}"

template:
- binary_sensor:
  - unique_id: 0c5ddaed-deda-4bf4-8a4c-93f5d25b47fa
    name: Irrigation Season
    default_entity_id: binary_sensor.irrigation_season
    device_class: heat
    state: >
      {% set start, end = ['sensor.irrigation_season_start', 'sensor.irrigation_season_end'] | map('states') | map('as_datetime') | map('as_local') | list %}
      {{ start <= now() <= end }}
    availability: >
      {{
        ['sensor.irrigation_season_start', 'sensor.irrigation_season_end'] | select('has_value') | list | count == 2
      }}

- sensor:
  - unique_id: 4554e955-260c-4f98-b564-953ef58da952
    name: Irrigation Season Start
    default_entity_id: sensor.irrigation_season_start
    device_class: timestamp
    state: >
      {% from 'easy_time.jinja' import month_day %}
      {{ month_day(6, 1) }}

  - unique_id: c4a5a8a6-317e-4d6b-9b64-eb9f792e9dbf 
    name: Irrigation Season End
    default_entity_id: sensor.irrigation_season_end
    device_class: timestamp
    state: >
      {% from 'easy_time.jinja' import month_day %}
      {{ month_day(11, 1) }}
