# Echo announcements: speaks or announces a message on the Echo Dots for a
# list of areas (script.notify_area), the dashboard's Announce/TTS buttons that
# send the Alexa Speech text box to the areas toggled on, and the MQTT sensor
# that records the last message sent.
#
# External entities used:
#   Labels (not entities): echo_tts. It marks the area toggles below; the
#   dashboard buttons find them through label_entities(), not by entity_id.
#   Alexa Devices (alexa_devices)
#     No area: Basement Echo Dot (2e8291b7bbf70d126406d09512b68c27)
#       notify.basement_echo_dot_announce
#       notify.basement_echo_dot_speak
#     No area: Bonus Room Echo Dot (4701c793d26c43073df6db9818cb5d10)
#       notify.bonus_room_echo_dot_announce
#       notify.bonus_room_echo_dot_speak
#     No area: Downstairs Zone (02e7409e504b748ac6a25d3283a0c214)
#       notify.downstairs_announce
#     No area: Everywhere Zone (aaa49856a6e7511ab0a06ac80e818a13)
#       notify.everywhere_announce
#     No area: Game Room Echo Dot (9a01f819aa232edef67022db2a407e55)
#       notify.game_room_echo_dot_announce
#       notify.game_room_echo_dot_speak
#     No area: Garage Echo Dot (3e12515a8fd6e013ae03791637462cca)
#       notify.garage_echo_dot_announce
#       notify.garage_echo_dot_speak
#     No area: Great Room Zone (3a58124ef7156a8e4414cdf5b02ec17e)
#       notify.great_room_announce
#     No area: Kitchen Echo Dot (40862d5f2336601424c6f8054e5c11b2)
#       notify.kitchen_echo_dot_announce
#       notify.kitchen_echo_dot_speak
#     No area: Living Room Echo Dot (8067196244f13df3048bd84dd34548b6)
#       notify.living_room_echo_dot_announce
#       notify.living_room_echo_dot_speak
#     No area: Master Echo Dot (8eea8a55a604cfc2b99b0bbd991174f8)
#       notify.master_echo_dot_announce
#       notify.master_echo_dot_speak
#   Person (person, UI)
#     every person (matched by user_id to name who sent an announcement)
#   Text helper (input_text, UI)
#     input_text.alexa_say
#   Toggle helper (input_boolean, UI), labeled echo_tts
#     input_boolean.basement
#     input_boolean.bonus_room
#     input_boolean.downstairs
#     input_boolean.everywhere
#     input_boolean.game_room
#     input_boolean.garage
#     input_boolean.kitchen
#     input_boolean.living_room
#     input_boolean.master_bedroom
#   scripts/mqtt.yaml
#     script.mqtt_automated_config
#     script.mqtt_automated_states
#   Not found (referenced, but no such entity exists):
#     notify.downstairs_speak
#     notify.everywhere_speak
#     notify.great_room_speak
#
# Entities created by this package:
#   script.notify_alexa_ui
#   script.alexa_announce
#   script.alexa_tts
#   script.notify_area
#   script.clear_alexa_text
#   sensor.alexa_last_tts (through MQTT discovery)

automation:
- alias: MQTT Discovery
  id: mqtt_store_echo_states_discovery
  mode: single
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: script.mqtt_automated_config
    data:
      domain: sensor
      unique_id: alexa_last_tts
      device_class: timestamp

script:
  notify_alexa_ui:
    alias: Button Helper
    mode: parallel
    fields:
      announce:
        description: Annouce or TTS (True for announce, False or omit for TTS)
        example: true
        default: on
        selector:
          boolean:
      user_id:
        description: Annouce or TTS (True for announce, False or omit for TTS)
        selector:
          text:
            type: text
    variables:

      # This configuration only holds differences between the input booleans
      # and the resulting areas.  Currently that is only master_bedroom to master.
      config:
        input_boolean.master_bedroom: master
      areas: >
        {% set entities = label_entities('echo_tts') %}
        {% set ns = namespace(items=[]) %}
        {% for boolean in entities | select('is_state', 'on') %}
          {% set area = config.get(boolean, boolean.split('.')[-1]) %}
          {% set ns.items = ns.items + [area] %}
        {% endfor %}
        {{ ns.items }}
      announce: >
        {{ announce | default(false) }}
      message: >
        {{ states('input_text.alexa_say') }}
      user_id: "{{ user_id | default(none) }}"
    sequence:
    - action: script.notify_area
      data:
        area: "{{ areas }}"
        message: "{{ message }}"
        announce: "{{ announce }}"
        user_id: "{{ user_id }}"


  alexa_announce:
    alias: Announce Button
    mode: single
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.notify_alexa_ui
      data:
        variables:
          announce: True
          user_id: >
            {{ context.user_id }}
    - delay: "00:00:01"

  alexa_tts:
    alias: TTS Button
    mode: single
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.notify_alexa_ui
      data:
        variables:
          announce: False
          user_id: >
            {{ context.user_id }}
    - delay: "00:00:01"


  notify_area:
    alias: Area
    mode: parallel
    fields:
      area:
        description: List of areas to notify
        example: Living Room
        selector:
          select:
            multiple: true
            options:
              - label: Basement
                value: basement
              - label: Bonus Room
                value: bonus_room
              - label: Downstairs
                value: downstairs
              - label: Everywhere
                value: everywhere
              - label: Game Room
                value: game_room
              - label: Garage
                value: garage
              - label: Great Room
                value: great_room
              - label: Kitchen
                value: kitchen
              - label: Living Room
                value: living_room
              - label: Master
                value: master
      message:
        description: Message to send
        example: "Hello"
        selector:
          text:
            type: text
      announce:
        description: Annouce or TTS (True for announce, False or omit for TTS)
        example: true
        selector:
          boolean:
      user_id:
        description: User ID
        example: 22e2ad009e2d4637994cb494afe30c8e
        selector:
          text:
            type: text
    variables:
      areas:
      - area: basement
        announce: notify.basement_echo_dot_announce
        speak: notify.basement_echo_dot_speak
      - area: bonus_room
        announce: notify.bonus_room_echo_dot_announce
        speak: notify.bonus_room_echo_dot_speak
      - area: downstairs
        announce: notify.downstairs_announce
        speak: notify.downstairs_speak
      - area: everywhere
        announce: notify.everywhere_announce
        speak: notify.everywhere_speak
      - area: game_room
        announce: notify.game_room_echo_dot_announce
        speak: notify.game_room_echo_dot_speak
      - area: garage
        announce: notify.garage_echo_dot_announce
        speak: notify.garage_echo_dot_speak
      - area: great_room
        announce: notify.great_room_announce
        speak: notify.great_room_speak
      - area: kitchen
        announce: notify.kitchen_echo_dot_announce
        speak: notify.kitchen_echo_dot_speak
      - area: living_room
        announce: notify.living_room_echo_dot_announce
        speak: notify.living_room_echo_dot_speak
      - area: master
        announce: notify.master_echo_dot_announce
        speak: notify.master_echo_dot_speak
      timestamp: >
        {{ (datetime | default(now())).isoformat() }}
      input: >
        {{ message | string | default('Empty') }}
      target_person: >
        {{ user_id | default('22e2ad009e2d4637994cb494afe30c8e') }}
      found_person: >
        {{ states.person | selectattr('attributes.user_id', 'eq', target_person) | map(attribute='entity_id') | first | default }}
      found_user: >
        {{ found_person | entity_name if found_person is not none else none }}
      user: >
        {{ found_user or 'unknown' }}
      should_announce: >
        {{ announce is defined and announce }}
      text: >
        {%- if message is defined and message is string and message %}
          {{ 'announcement from ' ~ user ~ ': ' if should_announce else '' }}{{ message.replace('fuck',"fu'ck").replace('shit',"sh'it").replace('bitch',"b'itch").replace('cunt', "kh'unt") }}
        {%- else %}none
        {%- endif %}
      method: >
        {{ 'announce' if should_announce else 'speak' }}
      formatted_area: >
        {{ area if area is list else [area] }}
      entities: >
        {{ areas | selectattr('area', 'in', formatted_area) | map(attribute=method) | list }}
      should_continue: >
        {{ text is not none and entities | length > 0 }}
      devices: >
        {{ entities | map('device_name') | map('replace', ' Echo Dot', '') | list }}
      attrs: >
        {%- set names = devices | join(', ') %}
        {{ { 'person': found_person, 'type': 'announce' if should_announce else 'tts','text': input, 'targets': names} }}
    sequence:
    - condition: template
      value_template: "{{ should_continue }}"
    - action: notify.send_message
      target:
        entity_id: "{{ entities | first }}"
      data:
        message: "{{ text }}"
    - action: script.mqtt_automated_states
      data:
        domain: sensor
        unique_id: alexa_last_tts
        state: "{{ timestamp }}"
        attributes: "{{ attrs | tojson }}"

  clear_alexa_text:
    alias: Clear Text Box
    sequence:
      - action: input_text.set_value
        data:
          entity_id: input_text.alexa_say
          value: ""
      - delay:
          seconds: 1
