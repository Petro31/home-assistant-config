# System recorder: the recorder's MySQL database, 60-day retention, and which
# entities get recorded. It records only the entities under include: entities,
# plus every light, switch and fan not listed under exclude: entities.
# Everything else (automations, scripts, helpers, most sensors) has no history
# or logbook. Add an entity to include: if a dashboard history graph or a
# history-based sensor needs it.
#
# Keep the system_ prefix on this filename, even though the folder repeats
# it. HA names a package after its filename alone (the folder is ignored),
# so a shorter name like recorder/logging/cloud could silently clash with
# another package anywhere under packages/.
#
# The lists below name entities by ID; they aren't repeated in this header.
# Entities created by this package: none.

recorder:
  db_url: !secret recorder_url
  purge_keep_days: 60
  include:
    entities:
      - binary_sensor.deck_motion_sensor_occupancy
      - binary_sensor.dryer_status
