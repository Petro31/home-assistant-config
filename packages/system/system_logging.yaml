# System logging: the default log level, log message filters, and system log
# events (system_log fire_event, so automations can react to logged errors).
#
# Keep the system_ prefix on this filename, even though the folder repeats
# it. HA names a package after its filename alone (the folder is ignored),
# so a shorter name like recorder/logging/cloud could silently clash with
# another package anywhere under packages/.
#
# Entities created by this package: none.

logger:
  default: info
  # logs:
    # requests.packages.urllib3.connectionpool: critical
    # frontend.js.latest: critical
    # py.warnings: critical
    # homeassistant.components.analytics: info
    # alexapy.helpers: error
    # custom_components.harmony_helper: debug
  filters:
    homeassistant.components.automation:
      - "Already running$"
    homeassistant.components.script:
      - "Already running$"
    homeassistant.components.zwave_js:
      - "^Passing the zwave_js.multicast_set_value service call to the zwave_js.set_value service since only one node was targeted$"
    # homeassistant.components.compensation.sensor:
      # - "attribute volume_level is not numerical$"
    aioamazondevices:
      - "Failed to obtain notification data.  Timers and alarms have not been updated"

system_log:
  fire_event: true
