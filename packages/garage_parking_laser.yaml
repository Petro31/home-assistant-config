# Turns on the garage laser when the front garage door opens to help
# position cars, and turns it off after 2 minutes or when the door closes.
# Also provides a dashboard switch that turns the laser on for 45 seconds.
#
# External entities used:
#   Z-Wave JS (zwave_js)
#     Car Bays: Laser (2d6df87244f8bf33f5238fd3a7815f47)
#       switch.garage_ceiling_outlet
#   template/door.yaml
#     binary_sensor.front_garage_door
#
# Entities created by this package:
#   script.laser_position_timer
#   switch.garage_temporary_laser

automation:
- alias: Garage position indicator
  id: laser_position_indicator_automation
  mode: parallel
  triggers: 
  - trigger: state
    entity_id:
    - binary_sensor.front_garage_door
  variables:
    laser: switch.garage_ceiling_outlet
    valid: >
      {{ trigger | default(none) is not none and trigger.to_state is defined and trigger.from_state is defined }}
    is_on: >
      {{ trigger.to_state.state == 'on' and trigger.from_state.state == 'off' }}
    is_off: >
      {{ trigger.to_state.state == 'off' and trigger.from_state.state == 'on' }}
    continue: >
      {{ valid and (is_on or is_off) }}
    is_laser_on: >
      {{ is_state(laser, 'on') }}
  
  conditions: 
  - condition: template
    value_template: "{{ continue }}"

  actions:

  - choose:
    - conditions:
      - condition: template
        value_template: "{{ is_on }}"
      sequence:

      - action: script.turn_off
        target:
          entity_id: script.laser_position_timer

      - choose:
        - conditions: 
          - condition: template
            value_template: "{{ not is_laser_on }}"
          sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ laser }}"

      - action: script.laser_position_timer

    - conditions:
      - condition: template
        value_template: "{{ is_off }}"
      sequence:
      - choose:
        - conditions: 
          - condition: template
            value_template: "{{ is_laser_on }}"
          sequence:
          - action: script.turn_off
            target:
              entity_id: script.laser_position_timer
  
          - action: switch.turn_off
            target:
              entity_id: "{{ laser }}"

script:
  # A timer script for turning on and off the lasers for positioning cars
  # in the carport.
  laser_position_timer:
    alias: Garage Timer
    mode: single
    variables:
      laser: switch.garage_ceiling_outlet
    sequence:
    - delay: "00:02:00"
    - action: switch.turn_off
      target:
        entity_id: "{{ laser }}"

template:
- switch:
  - unique_id: garage_temporary_laser
    name: Garage Temporary Laser
    default_entity_id: switch.garage_temporary_laser
    state: "{{ is_state('switch.garage_ceiling_outlet', 'on') }}"
    turn_on:
    - action: switch.turn_on
      <<: &garage_temporary_laser
        target:
          entity_id: switch.garage_ceiling_outlet
    - delay: 45
    - action: switch.turn_off
      <<: *garage_temporary_laser
    turn_off:
    - action: switch.turn_off
      <<: *garage_temporary_laser
