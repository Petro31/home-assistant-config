# Installs pending firmware updates for ESPHome and Zigbee (MQTT) devices,
# and combines the ESPHome device updates into a single update entity.
#
# External entities used:
#   ESPHome (esphome)
#     every update.* entity from this integration (found at runtime with integration_entities)
#   MQTT (mqtt)
#     every update.* entity from this integration (found at runtime with integration_entities)
#   Home Assistant Supervisor (hassio)
#     No area: ESPHome Device Builder (6a285555270beb8eb634891673d48bf2)
#       update.esphome_update
#   packages/shared/notifications.yaml
#     script.notify
#
# Entities created by this package:
#   script.update_esphome
#   script.update_zigbee
#   update.esphome_entities

script:
  update_esphome:
    alias: Update Esphome Devices
    mode: single
    variables:
      entities: >
        {{ integration_entities('esphome') | select('search','^update') | select('is_state','on') | list }}
      message: >
        Updating firmware for household sensors.
    sequence: &sequence
    - condition: template
      value_template: "{{ entities | length > 0 }}"
    - action: script.notify
      data:
        title: "Firmware Update"
        message: "{{ message }}"
    - action: update.install
      target:
        entity_id: "{{ entities }}"

  update_zigbee:
    alias: Update Zigbee Devices
    mode: single
    variables:
      entities: >
        {{ integration_entities('mqtt') | select('search','^update') | select('is_state','on') | list }}
      message: >
        Updating firmware for household hue lights.  Lights will not work for 1 hour.
    sequence: *sequence

template:
- update:
  - unique_id: e45a7111-a31c-423a-aa71-e7590d7e3d03
    name: Esphome Entities
    default_entity_id: update.esphome_entities
    picture: >
      {{ state_attr('update.esphome_update', 'entity_picture') }}
    installed_version: >
      {% set default_version = state_attr('update.esphome_update', 'installed_version') %}
      {% set ns = namespace(versions=[]) %}
      {% for ver in integration_entities('esphome') | select('search','^update') | select('is_state','on') | map('state_attr', 'installed_version') | unique %}
        {% set ns.versions = ns.versions + [version(ver)] %}
      {% endfor %}
      {{ ns.versions | sort | first | default(default_version) }}
    latest_version: >
      {% set default_version = state_attr('update.esphome_update', 'latest_version') %}
      {% set ns = namespace(versions=[]) %}
      {% for ver in integration_entities('esphome') | select('search','^update') | select('is_state','on') | map('state_attr', 'latest_version') | unique %}
        {% set ns.versions = ns.versions + [version(ver)] %}
      {% endfor %}
      {{ ns.versions | sort(reverse=true) | first | default(default_version) }}
    install:
    - action: script.update_esphome
