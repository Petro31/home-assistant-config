# Installs pending firmware updates for ESPHome, Zigbee (MQTT) and Z-Wave
# devices (Z-Wave one device at a time), and combines the ESPHome device
# updates into a single update entity.
#
# External entities used:
#   ESPHome (esphome)
#     every update.* entity from this integration (found at runtime with integration_entities)
#   MQTT (mqtt)
#     every update.* entity from this integration (found at runtime with integration_entities)
#   Z-Wave JS (zwave_js)
#     every update.* entity from this integration (found at runtime with integration_entities)
#   packages/shared/notifications.yaml
#     script.notify
#     notify.mobile_app_petro (notify group action, not an entity)
#
# Entities created by this package:
#   script.update_esphome
#   script.update_zigbee
#   script.update_zwave
#   update.esphome_entities

script:
  update_esphome:
    alias: Update Esphome Devices
    mode: single
    variables:
      entities: >
        {{ integration_entities('esphome') | select('search','^update') | select('is_state','on') | list }}
      message: >
        Updating firmware for household sensors.
    sequence: &sequence
    - condition: template
      value_template: "{{ entities | length > 0 }}"
    - action: script.notify
      data:
        title: "Firmware Update"
        message: "{{ message }}"
    - action: update.install
      target:
        entity_id: "{{ entities }}"

  update_zigbee:
    alias: Update Zigbee Devices
    mode: single
    variables:
      entities: >
        {{ integration_entities('mqtt') | select('search','^update') | select('is_state','on') | list }}
      message: >
        Updating firmware for household hue lights.  Lights will not work for 1 hour.
    sequence: *sequence

  update_zwave:
    alias: Update Zwave devices in order
    mode: single
    variables:
      _integration: zwave_js
      message_title: "{{ _integration | replace('_', ' ') | title }}"
      entities: >
        {{ integration_entities(_integration) | select('search','^update') | select('is_state','on') | list }}
      message: >
        Updating firmware for household zwave sensors.

    sequence:
      - condition: template
        value_template: "{{ entities | length > 0 }}"
      - action: script.notify
        data:
          title: >
            {{ message_title }} Firmware Update
          message: "{{ message }}"
      - repeat:
          for_each: "{{ entities }}"
          sequence:
            - action: script.notify
              data:
                title: >
                  {{ message_title }} Firmware Status
                message: Installing update for {{ device_name(repeat.item) }}
                notify: notify.mobile_app_petro
            - action: update.install
              target:
                entity_id: "{{ repeat.item }}"

template:
- update:
  - unique_id: e45a7111-a31c-423a-aa71-e7590d7e3d03
    name: Esphome Entities
    default_entity_id: update.esphome_entities
    picture: >
      {{ integration_entities('esphome') | select('search','^update') | map('state_attr', 'entity_picture') | select | first | default }}
    # With no updates pending, both versions fall back to the newest ESPHome
    # version installed on the devices (YYYY.M.P only; the Apollo AIR-1's own
    # vendor firmware entity uses a different numbering).
    installed_version: >
      {% set ns_all = namespace(versions=[]) %}
      {% for ver in integration_entities('esphome') | select('search','^update') | map('state_attr', 'installed_version') | select('match', '[0-9]{4}[.]') | unique %}
        {% set ns_all.versions = ns_all.versions + [version(ver)] %}
      {% endfor %}
      {% set default_version = ns_all.versions | sort | last | default %}
      {% set ns = namespace(versions=[]) %}
      {% for ver in integration_entities('esphome') | select('search','^update') | select('is_state','on') | map('state_attr', 'installed_version') | unique %}
        {% set ns.versions = ns.versions + [version(ver)] %}
      {% endfor %}
      {{ ns.versions | sort | first | default(default_version) }}
    latest_version: >
      {% set ns_all = namespace(versions=[]) %}
      {% for ver in integration_entities('esphome') | select('search','^update') | map('state_attr', 'installed_version') | select('match', '[0-9]{4}[.]') | unique %}
        {% set ns_all.versions = ns_all.versions + [version(ver)] %}
      {% endfor %}
      {% set default_version = ns_all.versions | sort | last | default %}
      {% set ns = namespace(versions=[]) %}
      {% for ver in integration_entities('esphome') | select('search','^update') | select('is_state','on') | map('state_attr', 'latest_version') | unique %}
        {% set ns.versions = ns.versions + [version(ver)] %}
      {% endfor %}
      {{ ns.versions | sort(reverse=true) | first | default(default_version) }}
    install:
    - action: script.update_esphome
