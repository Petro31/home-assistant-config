# Living room Yamaha receivers: receiver power sensor, source and sound mode
# switches, Echo and AirPlay music through the RX-V6A zones, and scripts that
# turn media players on at a set source and volume.
#
# Keep the living_room_ prefix on this filename, even though the folder
# repeats it. HA names a package after its filename alone (the folder is
# ignored), so a shorter name like harmony/remote/yamaha could silently
# clash with another package anywhere under packages/.
#
# External entities used:
#   Yamaha MusicCast (yamaha_musiccast)
#     Dining Room: RX-V6A Zone 2 (6a37bd692c94c39ed4bd4b1de7f56076)
#       media_player.yamaha_rx_v6a_zone2
#     Living Room: RX-V6A Zone 1 (4b66b537b89fb740de894c22f1e09407)
#       media_player.yamaha_rx_v6a
#   Z-Wave JS (zwave_js)
#     Living Room: Echo Outlet (313fff6a2ab8c1e3c9b1cd8b3139c4bb)
#       switch.floating_outlet_switch
#   packages/living_room/living_room_remote.yaml
#     switch.poweroff
#
# Entities created by this package:
#   binary_sensor.yamaha_receiver
#   switch.xbox_source
#   switch.playstation_source
#   switch.nintendo_switch_source
#   switch.roku_source
#   switch.phone_source
#   switch.chromecast_source
#   switch.alexa_source
#   switch.surround_mode_standard
#   switch.surround_mode_munich
#   switch.surround_mode_vienna
#   switch.surround_mode_chamber
#   switch.surround_mode_cellar_club
#   switch.surround_mode_roxy_theatre
#   switch.surround_mode_bottom_line
#   switch.surround_mode_sports
#   switch.surround_mode_action_game
#   switch.surround_mode_roleplaying_game
#   switch.surround_mode_music_video
#   switch.surround_mode_spectacle
#   switch.surround_mode_sci_fi
#   switch.surround_mode_adventure
#   switch.surround_mode_drama
#   switch.surround_mode_mono_movie
#   switch.surround_mode_2ch_stereo
#   switch.surround_mode_all_ch_stereo
#   switch.surround_mode_surr_decoder
#   switch.surround_mode_straight
#   switch.echo_through_receiver
#   switch.airplay_through_receiver
#   switch.echo_through_living_room
#   switch.living_room_airplay
#   switch.echo_through_dining_room
#   switch.dining_room_airplay
#   script.power_on
#   script.power_off
#   script.media_player_on
#   script.media_player_off
#   script.echo_through_receiver_on
#   script.airplay_through_receiver_on
#   script.echo_through_receiver_off
#   script.echo_through_media_player

script:
  power_on:
    alias: Power - Turn On Any Entity
    mode: parallel
    description: >
      Turns on any entity that can turn on, if they are off.
    fields: &power_fields
      entity:
        description: (Required) The entity in question
        example: media_player.yamaha_rx_v6a
        selector:
          entity:
    variables:
      state: 'off'
      service: "{{ entity.split('.')[0] }}.turn_on"
    sequence: &power_sequence
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ is_state(entity, state) }}"
        sequence:
        - action: "{{ service }}"
          target:
            entity_id: "{{ entity }}"

  power_off:
    alias: Power - Turn Off Any Entity
    mode: parallel
    description: >
      Turns off any entity that can turn off, if they are on.
    fields: *power_fields
    variables:
      state: 'on'
      service: "{{ entity.split('.')[0] }}.turn_off"
    sequence: *power_sequence

  media_player_on:
    alias: Power - Turn On Any Media Player and Set Volume
    mode: single
    description: >
      Turns on any media player to a desired source and sets the volume to 0.7.
    fields: 
      <<: &media_player_field
        media_player:
          description: (Required) The media_player.
          example: media_player.yamaha_rx_v6a
          required: true
          selector:
            entity:
              domain: media_player
      <<: &source_field
        source:
          description: (Required) The source to select
          required: true
          example: Echo
          selector:
            text:
              type: text
      volume:
        description: (Required) The volume level
        example: 0.7
        selector:
          number:
            min: 0.0
            max: 1.25
            step: 0.05
            unit_of_measurement: Volume
    sequence:
    - action: script.power_on
      data:
        entity: "{{ media_player }}"

    - choose:
      - conditions:
        - condition: template
          value_template: "{{ not is_state_attr(media_player, 'volume_level', volume) }}"
        sequence:
        - action: media_player.volume_set
          target:
            entity_id: "{{ media_player }}"
          data:
            volume_level: "{{ volume }}"

    - choose:
      - conditions:
        - condition: template
          value_template: "{{ not is_state_attr(media_player, 'source', source) }}"
        sequence:
        - action: media_player.select_source
          target:
            entity_id: "{{ media_player }}"
          data:
            source: "{{ source }}"

  media_player_off:
    alias: Power - Turn Off Any Media Player
    mode: single
    description: >
      Turns off any media player that is on.
    fields: 
      <<: *media_player_field
    sequence:
    - action: script.power_off
      data:
        entity: "{{ media_player }}"

  echo_through_receiver_on:
    alias: Living Room Streaming - Echo at 30db.
    mode: single
    description: >
      Streams from an echo on all zones and sets volume to -30db.
    sequence:
    - action: script.power_on
      data:
        entity: switch.floating_outlet_switch
    
    - action: script.media_player_on
      data:
        media_player: media_player.yamaha_rx_v6a
        volume: 0.7
        source: audio3
    
    - action: script.media_player_on
      data:
        media_player: media_player.yamaha_rx_v6a_zone2
        volume: 0.7
        source: audio3

  airplay_through_receiver_on:
    alias: Living Room Streaming - Airplay
    mode: single
    description: >
      Streams airplay on all zones and sets volume to -30db.
    sequence:
    - action: script.media_player_on
      data:
        media_player: media_player.yamaha_rx_v6a
        volume: 0.7
        source: airplay
    
    - action: script.media_player_on
      data:
        media_player: media_player.yamaha_rx_v6a_zone2
        volume: 0.7
        source: airplay

  echo_through_receiver_off:
    alias: Living Room Streaming - All Off
    mode: single
    description: >
      Turns off all streaming.
    sequence:

    # Turns off audio one but does not turn off the receiver.
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ is_state('media_player.yamaha_rx_v6a', 'on') and is_state('switch.poweroff', 'off') }}"
        sequence:
        - action: media_player.turn_off
          target:
            entity_id: media_player.yamaha_rx_v6a
        
    - action: script.power_off
      data:
        entity: media_player.yamaha_rx_v6a_zone2
        
    - action: script.power_off
      data:
        entity: switch.floating_outlet_switch

  echo_through_media_player:
    alias: Basement Streaming - Any
    mode: single
    description: >
      Turns on a stream through the basement receiver.
    fields: 
      switch:
        description: (Required) The bluetooth switch
        example: switch.basement_bluetooth
        required: true
        selector:
          entity:
            domain: switch
      <<: *media_player_field
      desired_state: 
        description: (Required) The target state for the script
        example: 'on'
        required: true
        selector:
          text:
            type: text
      <<: *source_field
    variables:
      players: >
        {% if media_player is string %}
          {{ [media_player] }}
        {% elif media_player is not string and media_player is iterable and media_player is not mapping %}
          {{ media_player }}
        {% else %}
          {{ [] }}
        {% endif %}
      continue: >
        {{ media_player | length > 0 }}
    sequence:
    - condition: template
      value_template: "{{ continue }}"

    - action: script.power_{{ desired_state }}
      data:
        entity: "{{ switch }}"

    - repeat: 
        for_each: "{{ players }}"
        sequence:
        - action: script.media_player_{{ desired_state }}
          data:
            media_player: "{{ repeat.item }}"
            volume: 0.7
            source: "{{ source }}"

template:
- binary_sensor:
  - unique_id: yamaha_receiver
    name: Yamaha Receiver
    default_entity_id: binary_sensor.yamaha_receiver
    device_class: power
    state: >
      {{ expand('media_player.yamaha_rx_v6a', 'media_player.yamaha_rx_v6a_zone2') 
                | selectattr('state','in',['on', 'playing', 'idle']) | list | length >= 1 }}
    attributes:
      template: yamaha

