# Door Buddy: config for the door_buddy custom integration (owner-maintained;
# upstream repo in CLAUDE.local.md). For each door it turns lights on when the
# door opens in the dark, notifies when a door is left open too long (unless
# nobody's home), and tracks when it was last opened.
#
# External entities used:
#   ESPHome (esphome)
#     Car Bays: Front Garage Door (09955d605c80fc51b4502ca8f48b6ee3)
#       cover.front_garage_door
#     Car Bays: Rear Garage Door (7f720b662ab811dba9017c2df237df6b)
#       cover.rear_garage_door
#   MQTT (mqtt)
#     Car Bays: Passenger Door (1a1c7fe039811a22d14f48d611d4bccf)
#       binary_sensor.passenger_door
#     Deck: Motion Sensor (0b9f44e7f25faeea6cc4cc5a9c602ba8)
#       sensor.deck_motion_sensor_illuminance
#     Server Room: Door (5987fbb1e62f0976c511c6b10b8a0dd2)
#       binary_sensor.server_room_door_contact
#   Z-Wave JS (zwave_js)
#     Back Yard: Flood / Sconce (c3baeb3b55b2be85800b1e188b2c7013)
#       switch.flood_light
#       switch.sliding_door_sconce
#     Car Bays: Cans (5c9b62e9ada1b7c4788c9408260001dd)
#       switch.garage_cans
#     Deck: Walkway Lights (ffc1ad3c7711ad628d22fdb1099793d1)
#       switch.deck_walkway
#     Dining Room: Chandelier (65e3c11152d87ef0475d41a5cdf3f9a4)
#       light.dining_room_chandelier
#     Dining Room: Sliding Door Sensor (96c33c075f7520d8509dce99763e33f9)
#       binary_sensor.sliding_door
#     Foyer: Dome (3b675e2013670d4d25391cb096df2a5c)
#       switch.foyer
#     Foyer: Main Door (748b79a9955dbea443c201351770498e)
#       binary_sensor.main_door
#     Mud Room: Dome (8815c84e2f115905cfd2dd3e2453f610)
#       switch.garage_entry
#     Mud Room: Entrance (675d12fe786e505ebd8d1d22ad0fb6b3)
#       binary_sensor.garage_entry_door
#     Server Room: Bulb (c6685c56d34e84fce09991e476a53358)
#       switch.server_room_switch
#   packages/home_occupancy.yaml
#     sensor.people_at_home
#
# Entities created by this package (door_buddy):
#   sensor.garage_door_last_opened
#   sensor.garage_entrance_last_opened
#   sensor.main_door_last_opened
#   sensor.passenger_door_last_opened
#   sensor.rear_garage_door_last_opened
#   sensor.server_room_door_last_opened
#   sensor.sliding_door_last_opened

door_buddy:
  main_door:
    name: Main Door
    source: binary_sensor.main_door
    unique_id: eb762336-a7ce-4c57-8fdf-13e05bf89997
    <<: &entrance
      lux_threshold: 500
      lux_sensor: sensor.deck_motion_sensor_illuminance
      people_tracker: sensor.people_at_home
      use_sun: yes
      notify: on
    on_duration:
      seconds: 120
    open_too_long_duration:
      seconds: 90
    quiet_window:
      seconds: 120
    turn_on:
    - switch.foyer

  garage_entrance:
    name: Garage Entrance
    source: binary_sensor.garage_entry_door
    unique_id: 30edf98f-b119-4728-a343-1cac2ef3af28
    <<: *entrance
    on_duration:
      seconds: 120
    open_too_long_duration:
      seconds: 90
    quiet_window:
      seconds: 120
    turn_on:
    - switch.garage_entry
    - switch.garage_cans

  sliding_door:
    name: Sliding Door
    source: binary_sensor.sliding_door
    unique_id: eb256a1b-b7b7-4b3b-9420-149febabd027
    <<: *entrance
    on_duration:
      seconds: 30
    open_too_long_duration:
      seconds: 240
    quiet_window:
      seconds: 120
    turn_on:
    - light.dining_room_chandelier
    - switch.flood_light
    - switch.sliding_door_sconce
    - switch.deck_walkway

  # mosby_door:
  #   name: Mosby Door
  #   source: binary_sensor.sliding_door
  #   unique_id: 34d95b04-dde2-45ba-801b-ecc46bd5e3f7
  #   lux_threshold: 500
  #   lux_sensor: sensor.deck_motion_sensor_illuminance
  #   on_duration:
  #     seconds: 30
  #   turn_on:
  #   - switch.flood_light
  #   - switch.sliding_door_sconce

  front_garage_door:
    name: Front Garage Door
    source: cover.front_garage_door
    unique_id: 0659ff4d-4e90-428d-ba60-1f09c58fa7eb
    <<: &garage_door
      people_tracker: sensor.people_at_home
      notify: on
      open_too_long_duration:
        seconds: 300

  rear_garage_door:
    name: Rear Garage Door
    source: cover.rear_garage_door
    unique_id: 49bcd1ce-dc64-4448-be16-67023dcf3981
    <<: *garage_door

  passenger_door:
    name: Passenger Door
    source: binary_sensor.passenger_door
    unique_id: af17f25c-ba55-407c-9e0f-47edff24a175
    people_tracker: sensor.people_at_home
    notify: on
    open_too_long_duration:
      seconds: 120
    quiet_window:
      seconds: 120

  server_room_door:
    name: Server Room Door
    source: binary_sensor.server_room_door_contact
    unique_id: 7f41ec35-9a92-4cf0-9b32-17f5feef116d
    turn_on:
    - switch.server_room_switch
