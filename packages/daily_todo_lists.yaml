# Builds the daily and weekly to-do lists: each night it adds the week's
# runs from the run schedule and today's calendar events, then rolls both
# lists up into a sensor for the This Week dashboard.
#
# External entities used:
#   Local To-do (local_todo, UI)
#     todo.mike_today
#     todo.mike_this_week
#   Local Calendar (local_calendar, UI)
#     calendar.hvac
#     calendar.mosby
#     calendar.waste_management
#   Google Calendar (google, UI)
#     calendar.dinner_club_2_0
#     calendar.holidays_in_united_states
#   Date/Time helper (input_datetime, UI)
#     input_datetime.mike_run_program
#   Text helper (input_text, UI)
#     input_text.mike_run_program
#   scripts/run_schedule.yaml
#     script.set_run_schedule
#
# Entities created by this package:
#   script.set_mikes_daily_list
#   sensor.mikes_todo_overview

automation:
- alias: Setup Mike's Todo Lists
  id: d11bb907-e656-4a0b-8f03-ecbbf3e40a3a
  mode: single
  triggers:
  - trigger: time
    at: "00:00:00"
  - trigger: event
    event_type: run_manual_schedule_update
  variables:
    program: >
      {{ states('input_text.mike_run_program') }}
    day: >
      {% from 'easy_time.jinja' import count_the_days %}
      {# Assumes monday is always selected #}
      {{ count_the_days('input_datetime.mike_run_program') }}
    week: >
      {{ (day | abs / 7 + 1) | int }}
  actions:
  # Setup runs.
  - if: "{{ 1 <= week <= 10 }}"
    then:
    - action: script.set_run_schedule
      data:
        program: "{{ program }}"
        week: "{{ week }}"
        weekly_todo: todo.mike_this_week
        daily_todo: todo.mike_today
        max_heart_rate: 195

  # Setup Events.
  - action: script.set_mikes_daily_list

  - event: roll_up_todo

script:
  set_mikes_daily_list:
    alias: Set Mikes Daily Todo List
    mode: single
    fields:
      date:
        description: Choose a day, omit to use today.
        selector:
          date:
    variables:
      _date: "{{ date | default(today_at().date() | string) }}"
      start: "{{ (_date | as_datetime).isoformat() }}"
      daily_todo: todo.mike_today
      calendars:
        calendar.dinner_club_2_0: Dinner Club
        calendar.hvac: Change Filters
        calendar.mosby: Mosby
        calendar.waste_management: Waste Management
        calendar.holidays_in_united_states: Holiday

    sequence:
    - action: calendar.get_events
      data:
        start_date_time: "{{ start }}"
        duration:
          hours: 24
      target:
        entity_id: "{{ calendars.keys() | list }}"
      response_variable: events

    - action: todo.get_items
      <<: &daily
        target: 
          entity_id: "{{ daily_todo }}"
      response_variable: daily

    - variables:
        current: "{{ daily.get(daily_todo, {}).get('items', []) | map(attribute='summary') | list }}"
        todo: >
          {%- set ns = namespace(items=[]) %}
          {%- for entity, name in calendars.items() %}
            {%- set event = events.get(entity, {}).get('events',[]) | first | default({}) %}
            {%- set ns.items = ns.items + [dict(item=name, description=event.summary | default(None))] %}
          {%- endfor %}
          {{- ns.items }}

    - condition: "{{ todo | count > 0 }}"
    - repeat:
        for_each: "{{ todo }}"
        sequence:
        - choose:
          - conditions: "{{ repeat.item.description is none and repeat.item.item in current }}"
            sequence:
            - action: todo.remove_item
              <<: *daily
              data:
                item: "{{ repeat.item.item }}"

          - conditions: "{{ repeat.item.description is not none and repeat.item.item in current }}"
            sequence:
            - action: todo.update_item
              <<: *daily
              data: "{{ repeat.item }}"

          - conditions: "{{ repeat.item.description is not none and repeat.item.item not in current }}"
            sequence:
            - action: todo.add_item
              <<: *daily
              data: "{{ repeat.item }}"

template:
- triggers:
  - trigger: event
    event_type: roll_up_todo
  - trigger: event
    event_type: event_template_reloaded
  actions:
  - action: todo.get_items
    target:
      entity_id:
      - todo.mike_this_week
      - todo.mike_today
    response_variable: todo
  - variables:
      base:
        type: custom:mushroom-template-card
        multiline_secondary: True
      defaults:
        icon: mdi:calendar-star
        icon_color: '#9119b3' #9119b3
      settings:
      - find: Waste Management
        icon: mdi:delete
        icon_color: '#026928' #026928
      - find: Dinner Club
        icon: mdi:food-steak
        icon_color: '#a16868' #a16868
      - find: Mosby
        icon: mdi:dog
        icon_color: '#cecdb6' #cecdb6
      - find: Change Filters
        icon: mdi:air-filter
        icon_color: '#808080' #808080
      - find: Run
        icon: mdi:run-fast
        icon_color: '#FDB813' #FDB813
      rollup: >
        {%- set ns = namespace(daily=[], weekly=[]) %}
        {%- for entity, obj in todo.items() %}
          {%- for item in obj.get('items', []) %}
            {% set current = settings | selectattr('find', 'in', item.summary) | first | default(defaults) %}
            {% set base_settings = dict.from_keys(base.items() | list + current.items() | list) %}
            {% set base_settings = dict(primary=item.summary, secondary=item.description, **base_settings) %}
            {% if 'today' in entity %}
              {% set ns.daily = ns.daily + [base_settings] %}
            {% else %}
              {% set ns.weekly = ns.weekly + [base_settings] %}
            {% endif %}
          {%- endfor %}
        {%- endfor %}
        {{ dict(today=ns.daily, this_week=ns.weekly) }}
  sensor:
  - name: Mikes Todo Overview
    default_entity_id: sensor.mikes_todo_overview
    unique_id: 6efa435d-f541-467e-99b8-ac15e3d94603
    state: "{{ rollup.items() | map(attribute='1') | sum(start=[]) | count }}"
    attributes:
      today: "{{ rollup.today }}"
      this_week: "{{ rollup.this_week }}"
