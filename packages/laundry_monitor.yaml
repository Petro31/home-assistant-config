# Notifies (and announces through Alexa) when the washer or dryer finishes,
# based on their power draw, and tracks the washer's spin cycles in
# MQTT-discovered binary sensors.
#
# External entities used:
#   Shelly (shelly)
#     Basement: Washer and Dryer Channel 1 (62e69d9c527d026007caa0cdb4737f5c)
#       sensor.washer_power
#     Basement: Washer and Dryer Channel 2 (4f70b97f4caca70a5d056a7dae4c2ff8)
#       sensor.dryer_power
#   Toggle helper (input_boolean, UI)
#     input_boolean.test_washer
#   scripts/mqtt.yaml
#     script.mqtt_automated_config
#     script.mqtt_automated_states
#   scripts/notifiers.yaml
#     script.notify
#
# Unused (but related) entities:
#   mqtt/binary_sensor.yaml
#     binary_sensor.washer_power_mqtt
#     binary_sensor.dryer_power_mqtt
#   Number helper (input_number, UI)
#     input_number.test_washer
#
# Entities created by this package:
#   binary_sensor.announce_washer
#   binary_sensor.announce_dryer
#   binary_sensor.washer_status
#   binary_sensor.dryer_status
#   binary_sensor.washer (through MQTT discovery)
#   binary_sensor.test_washer (through MQTT discovery)
#   script.reset_washer
#   script.calculate_washer_cycle

automation:
- alias: Notify
  id: announce_dryer_when_complete
  mode: parallel
  triggers:
  - trigger: state
    entity_id: 
    - binary_sensor.dryer_status
    - binary_sensor.washer
    to: 'off'
    from: 'on'
  variables:
    valid: >
      {{ trigger | default(none) is not none and trigger.to_state is defined and trigger.from_state is defined }}
    timeout: >
      {%- if valid %}
        {{ as_timestamp(trigger.to_state.last_changed, 0) - as_timestamp(trigger.from_state.last_changed, 0) }}
      {% endif %}
    continue: >
      {{ timeout and timeout > 15 }}
    name: >
      {{ entity_name(trigger.entity_id).split(' ')[0] if valid else 'Unknown' }}
    announce: >
      {{ name.lower() if name != 'Unknown' else none }}
      
  conditions:
  - condition: template
    value_template: "{{ continue and announce is not none }}"
  actions:
  - event: announce_energy
    event_data: 
      machine: "{{ announce }}"
  - action: script.notify
    data:
      title: "{{ name }} is finished!"
      message: "{{ name }} is finished!"

- alias: Cycle Counter
  id: washer_and_dryer_cycle_counter
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.test_washer
    - binary_sensor.washer_status
  variables:

    <<: &prefix
      prefix: washer_dryer_

    valid: >
      {{ trigger | default(none) is not none and trigger.to_state is defined and trigger.from_state is defined }}
    continue: >
      {{ trigger.to_state.state != trigger.from_state.state if valid else False }}
    source: >
      {{ trigger.entity_id }}
    next_phase: >
      {{ trigger.to_state.state if valid else none }}

  conditions:
  - condition: template
    value_template: "{{ continue }}"
  actions:
  - action: script.calculate_washer_cycle
    data:
      prefix: "{{ prefix }}"
      source: "{{ source }}"
      next_phase: "{{ next_phase }}"

- alias: MQTT Discovery
  id: 3e5e2ffb-d811-4818-a6bd-1f1386c6dbae
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      <<: *prefix
      binary_sensors:
      - test_washer
      - washer
  - repeat:
      count: "{{ binary_sensors | length }}"
      sequence:
      - action: script.mqtt_automated_config
        data:
          domain: binary_sensor
          unique_id: "{{ prefix }}{{ binary_sensors[repeat.index - 1] }}"
          object_id: "{{ binary_sensors[repeat.index - 1] }}"
          device_class: running

script:
  reset_washer:
    alias: Reset the state
    mode: single
    sequence:
    - action: script.calculate_washer_cycle
      data:
        reset: true
        source: binary_sensor.washer_status
        next_phase: "off"
        prefix: washer_dryer_

  calculate_washer_cycle:
    alias: Calculate Current Cycle
    mode: parallel
    fields:
      prefix:
        description: (Required) start part of the unique_id
        example: foo
        required: True
        default: washer_dryer_
        selector:
          select:
            options:
            - washer_dryer_
      source: 
        description: (Required) Source of the state change
        example: binary_sensor.washer_status
        required: True
        default: binary_sensor.washer_status
        selector:
          entity:
            include_entities:
            - binary_sensor.washer_status
      next_phase:
        description: (Required) State of the next phase
        example: 'on'
        required: True
        default: 'off'
        selector:
          select:
            options:
            - label: "On"
              value: 'on'
            - label: "Off"
              value: 'off'
      reset:
        description: (Optional) Reset the cycle.
        example: True
        default: False
        selector:
          boolean:

    variables:

      # MQTT SETUP
      root: homeassistant
      topic_root: binary_sensor
      config: &config
        input_boolean.test_washer:
          final_spin:
            duration: 10
            window: 5
        binary_sensor.washer_status:
          object_id: washer
          final_spin:
            duration: 600
            window: 60

      # SETTING THE BINARY SENSOR STATE
      current: >
        {{ config.get(source) }}
      have_current: >
        {{ current is not none }}
      object_id: >
        {{ current.object_id if current.object_id is defined and have_current else source.split('.')[-1] }}
      entity: >
        {{ topic_root }}.{{ object_id }}
      unique_id: >
        {{ prefix }}{{ object_id }}
      phase_timestamp: >
        {{ now().isoformat() }}
      idle:
        phase: 'off'
        start: "{{ phase_timestamp }}"
        action: 'idle'
      current_cycles: >
        {{ state_attr(entity or 'dump', 'cycles') or [] }}
      current_cycle: >
        {{ (current_cycles or []) | last | default(none) }}
      current_phase: >
        {{ current_cycle.phase if current_cycle is not none else none }}
      next_cycle: >
        {% if current_cycle is not none %}
          {% if current_phase != next_phase %}
            {{ {'phase': next_phase, 'start': phase_timestamp} }}
          {% else %}
            {{ current_cycle }}
          {% endif %}
        {% else %}
          {{ {'phase': next_phase if next_phase == 'on' else 'off', 'start': phase_timestamp} }}
        {% endif %}
      cycles: >
        {% set rollup = current_cycles + [ next_cycle ] %}
        {% set ns = namespace(ret=[], attrs=[]) %}

        {# setup durations for phases #}
        {% if reset is not defined or not reset %}
          {% for i in range(rollup | length) %}
            {% set attrs = rollup[i] %}
            {% set next_attrs = rollup[i + 1] if i + 1 < rollup | length else {} %}
            {% set ns.attrs = attrs.items() | rejectattr('0','in',['duration', 'action']) | list %}
            {% set duration = (next_attrs.start | as_datetime - attrs.start | as_datetime).seconds if next_attrs else 0.0 %}
            {% set ns.attrs = ns.attrs + [('duration', duration)] %}
  
            {% if attrs.phase == 'on' %}
  
              {# on state, try to find phase #}
              {% set l, u = current.final_spin.duration - current.final_spin.window, current.final_spin.duration + current.final_spin.window %}
              {% if l <= duration <= u %}
                {% set ns.attrs = ns.attrs + [('action', "finish")] %}
              {% else %}
                {% set ns.attrs = ns.attrs + [('action', "spinning")] %} 
              {% endif %}
            {% else %}
              {# off state, do not collect phase #}
              {% set ns.attrs = ns.attrs + [('action', "idle")] %}
            {% endif %}
            {% set ns.ret = ns.ret + [dict(ns.attrs)] %}
          {% endfor %}
          {% set last = ns.ret | list | last | default(idle) %}
          {% if ns.ret | length == 1 and last.phase in ['off', 'idle'] %}
            []
          {% else %}
            {{ ns.ret if 'finish' not in ns.ret | map(attribute='action') else [] }}
          {% endif %}
        {% else %}
          []
        {% endif %}
      next_state: >
        O{{ 'N' if cycles | length > 0 else 'FF' }}

    sequence:
    - action: script.mqtt_automated_states
      data:
        <<: &mqtt
          domain: binary_sensor
        unique_id: "{{ unique_id }}"
        state: "{{ next_state }}"
        attributes: "{{ {'source': source, 'cycles': cycles} }}"

template:
- triggers:
  - trigger: event
    event_type: announce_energy
    event_data:
      machine: washer
  binary_sensor:
  - unique_id: announce_washer
    name: Announce Washer
    default_entity_id: binary_sensor.announce_washer
    device_class: door
    state: "{{ True }}"
    auto_off: 0.1

- triggers:
  - trigger: event
    event_type: announce_energy
    event_data:
      machine: dryer
  binary_sensor:
  - unique_id: announce_dryer
    name: Announce Dryer
    default_entity_id: binary_sensor.announce_dryer
    device_class: door
    auto_off: 0.1
    state: "{{ True }}"

- triggers:
  - entity_id: sensor.washer_power
    <<: &my_trigga
      trigger: state
      not_to:
      - unknown
      - unavailable
      not_from:
      - unknown
      - unavailable
  binary_sensor:
  - unique_id: washer_status
    name: Washer Status
    default_entity_id: binary_sensor.washer_status
    device_class: power
    state: >
      {{ trigger.to_state.state | float > 80 }}
    attributes:
      template: energy

- triggers:
  - entity_id: sensor.dryer_power
    <<: *my_trigga
  binary_sensor:
  - unique_id: dryer_status
    name: Dryer Status
    default_entity_id: binary_sensor.dryer_status
    device_class: power
    state: >
      {{ trigger.to_state.state | float > 150 }}
    attributes:
      template: energy
