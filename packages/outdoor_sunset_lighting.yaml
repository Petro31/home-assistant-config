# Outdoor sunset lighting: at sunset, turns the outdoor bulbs on with the
# season's scene (sensor.seasonal_lights), and at sunrise switches them to the
# sunrise scene. If someone turns off a front door sconce switch or the porch
# outlet, turns it back on, notifies, announces it in the living room and,
# during the day, turns the bulbs back off. The porch outlet powers the front
# yard uplights and the outdoor receptacle (Z-Wave, plugged into it), so at
# sunset script.outside_porch_power turns it on first (if it's off) and waits
# for them to come back before they're used. light.area_outside switches the
# outside lights together, except those always-on front door sconces and the
# porch outlet (the Outside area's target on the Home v2 dashboard). Also
# holds the everyday outdoor bulb
# scenes: Sunrise Bulbs (all off), Soft White (the default when there's no
# holiday) and DayLight.
#
# External entities used:
#   Group (group, UI)
#     light.outdoor_bulbs
#   MQTT (mqtt)
#     Front Yard: Garage Door Left Bulb (a601f2794fc36effc0cffb767485bd40)
#       light.garage_sconce_left_bulb
#     Front Yard: Garage Door Right Bulb (48540c549cff5acaa24779839108dc4e)
#       light.garage_sconce_right_bulb
#     Front Yard: Main Door Left Bulb (51abc464a490917f743e4db6d0866263)
#       light.main_door_left_bulb
#     Front Yard: Main Door Right Bulb (5f65fbf28117e47fb1e18d220107aac4)
#       light.main_door_right_bulb
#     Front Yard: Passenger Door Bulb (c891bf3c80ca54eb5e78fe78167e9f2b)
#       light.passenger_door_bulb
#     Front Yard: Uplight Left (a918c67ea821a0454a03d20d0357d1b7)
#       light.front_yard_uplight_left
#     Front Yard: Uplight Middle (57cdbc11d8edb45527be2ee453f90d5d)
#       light.front_yard_uplight_middle
#     Front Yard: Uplight Right (887f1338ee29de89beeb686df55f88e7)
#       light.front_yard_uplight_right
#   Sun (sun)
#     sun.sun (through the sun triggers and condition)
#   Z-Wave JS (zwave_js)
#     Back Yard: Flood / Sconce (c3baeb3b55b2be85800b1e188b2c7013)
#       switch.flood_light
#       switch.sliding_door_sconce
#     Front Yard: Garage Sconces (b1d0a1ebdf7883af6ca9be5ad848e5eb)
#       switch.sconces_garage
#     Front Yard: Main Door Sconces (355f69100e17fb9869a9bbcb7198786f)
#       switch.sconces_main_entrance
#     Front Yard: Passenger Door Sconce (12ec0b2afff1bb467983d1c17993f753)
#       switch.passenger_sconce
#     Porch: Outlet (e6ac7faef32679c1f2951bd80a3a2978)
#       switch.outside_porch
#     Porch: Outdoor Receptacle (ba33e8ffacdb12807b90d8f43a80dc45)
#       sensor.outdoor_receptacle_node_status
#   packages/echo_announcements.yaml
#     script.notify_area
#   packages/holiday/holiday_christmas.yaml and holiday_scenes.yaml
#     scene.holiday_bulbs_* (whichever one sensor.seasonal_lights names)
#   packages/holiday/holiday_lighting.yaml
#     sensor.seasonal_lights
#   packages/shared/notifications.yaml
#     script.notify
#
# Entities created by this package:
#   light.area_outside (the outside lights but the always-on sconces; group-like)
#   script.sunrise_sunset
#   script.outside_porch_power
#   scene.sunrise_bulbs (no unique_id)
#   scene.holiday_bulbs_soft_white (no unique_id)
#   scene.holiday_bulbs_daylight (no unique_id)

# On while any outside light is on; turns them all on or off. Leaves out the
# always-on front door sconces (switch.passenger_sconce, switch.sconces_garage
# and switch.sconces_main_entrance) and the always-on porch outlet
# (switch.outside_porch, which powers the uplights and the outdoor
# receptacle): never turned off, never counted. The
# Outside area's lights target on the Home v2 dashboard (like the generated
# light.area_* targets, which don't cover the outside areas). The entity_id
# attribute lists them, so it acts like a group.
template:
- light:
  - unique_id: area_outside
    name: Outside
    default_entity_id: light.area_outside
    icon: mdi:tree
    variables:
      entities: [switch.sliding_door_sconce, switch.flood_light, light.main_door_left_bulb, light.main_door_right_bulb, light.passenger_door_bulb, light.garage_sconce_left_bulb, light.garage_sconce_right_bulb, light.front_yard_uplight_left, light.front_yard_uplight_middle, light.front_yard_uplight_right]
    state: >
      {{ entities | select('is_state', 'on') | list | count > 0 }}
    attributes:
      entity_id: >
        {{ entities }}
    turn_on:
    - action: homeassistant.turn_on
      target:
        entity_id: "{{ entities }}"
    turn_off:
    - action: homeassistant.turn_off
      target:
        entity_id: "{{ entities }}"

automation:
- alias: Outdoor Lights On at Sunset, Off at Sunrise
  id: outdoor_lights_on_off
  triggers:
    - trigger: sun
      event: sunset
    - trigger: sun
      event: sunrise
  variables:
    event: >
      {{ trigger.event | default('invalid') }}
    scene: >
      {{ states('sensor.seasonal_lights') }}
  actions:
    - action: script.sunrise_sunset
      data:
        event: "{{ event }}"
        scene: "{{ scene }}"

- alias: Keep Sunset Switches On.
  id: reaction_keep_sunset_switches_on
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - switch.passenger_sconce
    - switch.sconces_garage
    - switch.sconces_main_entrance
    - switch.outside_porch
    to: 'off'
  variables:
    continue: >
      {{ trigger | default(none) is not none and trigger.to_state is defined and trigger.from_state is defined }}
  conditions:
  - condition: template
    value_template: "{{ continue }}"
  actions:
  - action: switch.turn_on
    target:
      entity_id: "{{ trigger.entity_id }}"
  - action: script.notify
    data:
      title: "Sunset Switch Turned Off"
      message: >
        {{ trigger.entity_id | entity_name }} switch was turned off, turning back on.
  - action: script.notify_area
    data:
      message: Jim counter action initiative in affect. Turning on {{ trigger.entity_id | entity_name }}.
      announce: False
      area: living_room
  - condition: sun
    after: sunrise
    before: sunset
  - delay:
      seconds: 5
  - action: light.turn_off
    target:
      entity_id: light.outdoor_bulbs

script:
  sunrise_sunset:
    alias: Sunrise/Sunset - Scenes
    mode: single
    fields:
      event: 
        description: Sunrise or sunset event
        example: sunrise
        required: true
        selector:
          select:
            options:
            - label: Sunrise
              value: sunrise
            - label: Sunset
              value: sunset
      scene:
        description: What Scene to run, if sunset
        example: scene.holiday_bulbs_soft_white
        selector:
          entity:
            domain: scene
  
    variables:
      evt: >
        {{ event | default('invalid') }}
      input_scene: >
        {{ scene | default('unknown') }}
      execute_scene: >
        {{ event in ['sunset', 'sunrise'] and start_scene not in ['unknown', 'unavailable'] }}
      start_scene: >
        {{ input_scene if event == 'sunset' else 'scene.sunrise_bulbs' }}
      continue: >
        {{ evt in ['sunset','sunrise'] and execute_scene }}
    sequence:
    - condition: template
      value_template: "{{ continue }}"
    # The scene sets the uplights, which are powered by the porch outlet.
    - if: "{{ evt == 'sunset' }}"
      then:
      - action: script.outside_porch_power
    - action: scene.turn_on
      target:
        entity_id: "{{ start_scene }}"

  # Turns on the porch outlet (it powers the front yard uplights and the
  # outdoor receptacle) if it's off, then waits for them to come back: the
  # receptacle's Z-Wave node to report alive (up to 2 minutes), then a few
  # seconds for the uplights to rejoin Zigbee. Returns right away when the
  # outlet is already on. Called (and waited on) at sunset by
  # script.sunrise_sunset and the holiday lights automation
  # (packages/holiday/holiday_lighting.yaml); parallel so both can wait.
  outside_porch_power:
    alias: Outside Porch Power
    mode: parallel
    sequence:
    - if: "{{ is_state('switch.outside_porch', 'off') }}"
      then:
      - action: switch.turn_on
        target:
          entity_id: switch.outside_porch
    - if: "{{ not is_state('sensor.outdoor_receptacle_node_status', 'alive') or (now() - states.switch.outside_porch.last_changed).total_seconds() < 15 }}"
      then:
      - delay:
          seconds: 5
      - wait_template: "{{ is_state('sensor.outdoor_receptacle_node_status', 'alive') }}"
        timeout:
          minutes: 2
      - delay:
          seconds: 10

