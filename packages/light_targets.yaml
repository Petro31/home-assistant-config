# Light targets: template lights for each area, area group, floor and floor
# group (lights labeled target_light), plus the Great Room. Turning one on or
# off runs script.light_handler, which switches every labeled light and switch
# in that area or floor in parallel, using Z-Wave multicast where it can. When
# a multicast call fails, an automation refreshes the Z-Wave lights in that
# target and retries it.
#
# The template lights live in packages/.lights/ and are included below. Those
# files are generated by the Jinja in their header comments: don't edit them
# by hand. The folder starts with a dot so HA doesn't load its files as
# packages.
#
# External entities used:
#   Labels (not entities): target_light, indoor_ambiance, and the
#   {"endpoint": N} labels that mark Z-Wave multicast endpoints.
#   Areas and floors: found through the target_light label.
#   Z-Wave JS (zwave_js): every zwave_js light and switch in the targeted
#   areas, through zwave_js.multicast_set_value.
#   packages/shared/notifications.yaml
#     script.notify
#     notify.mobile_app_petro (notify group action, not an entity)
#
# Entities created by this package:
#   sensor.multicast_error (trigger-based: last failed multicast call)
#   script.get_light_endpoints
#   script.get_light_entities
#   script.get_entities_from_light_group
#   script.get_zwave_entities_from_light_group
#   script.turn_on_off_lights_and_switches_in_parallel (called as the script.light_handler action)
#   packages/.lights/light_area_group_targets.yaml
#     light.area_bonus_room
#     light.area_master_suite
#   packages/.lights/light_area_targets.yaml
#     light.area_basement
#     light.area_bonus_bedroom
#     light.area_car_bays
#     light.area_craft_room
#     light.area_deck
#     light.area_dining_room
#     light.area_foyer
#     light.area_game_room
#     light.area_guest_bathroom
#     light.area_hallway
#     light.area_kitchen
#     light.area_laundry_room
#     light.area_living_room
#     light.area_master_bathroom
#     light.area_master_bedroom
#     light.area_master_closet
#     light.area_mud_room
#     light.area_office
#     light.area_patio
#     light.area_powder_room
#     light.area_vacation_planning_room
#     light.area_work_bench
#     light.area_workshop
#   packages/.lights/light_floor_group_targets.yaml
#     light.floor_all
#     light.floor_inside
#     light.floor_outside
#   packages/.lights/light_floor_targets.yaml
#     light.floor_downstairs
#     light.floor_garage
#     light.floor_upstairs
#   packages/.lights/light_great_room.yaml
#     light.area_great_room

automation:
- alias: Fix Zwave Multicast Errors
  id: 6c4bb70c-e8a7-40c8-9c78-bb077023e3b9
  description: Refreshes a zwave multicast light and attempts to fix it.
  mode: single
  triggers:
  - trigger: state
    entity_id: sensor.multicast_error
    <<: &unavailable
      not_from:
      - unknown
      - unavailable
      not_to:
      - unknown
      - unavailable
  variables:
    action: "{{ trigger.to_state.attributes.action | default(None) }}"
    entity_id: "{{ trigger.to_state.attributes.entity_id | default(None) }}"
    new: &new >
      {# Stops reload template from triggering. #}
      {%- set t = now() %}
      {%- set yesterday = t - timedelta(hours=24) %}
      {{ t - trigger.to_state.state | as_datetime(yesterday) | as_local < timedelta(seconds=10) }}
    continue: "{{ action is not none and entity_id is not none and entity_id | count > 0 and new }}"
  conditions:
  - condition: template
    value_template: "{{ continue }}"
  actions:
  - action: script.notify
    data:
      notify: notify.mobile_app_petro
      title: Multicast Error
      message: Refreshing {{ entity_id | map('entity_name') | join(', ') }}

  # entity_id is a list: the failed service call can target several lights.
  - repeat:
      for_each: "{{ entity_id }}"
      sequence:
      - action: script.get_zwave_entities_from_light_group
        data:
          light: "{{ repeat.item }}"
        response_variable: response

      - delay: 1

      - if: "{{ response.entity_id | count > 0 }}"
        then:
        - action: zwave_js.refresh_value
          target:
            entity_id: "{{ response.entity_id }}"

  - action: "{{ action }}"
    target:
      entity_id: "{{ entity_id }}"

######################################################################
# TEMPLATE LIGHTS: all 40 light.area_* / light.floor_* entities are  #
# included from packages/.lights/. Those files are GENERATED by the  #
# Jinja in their header comments. Don't edit them by hand.           #
######################################################################
template: !include_dir_merge_list .lights

# Labeled key because "template:" above is taken by the .lights include.
template multicast_error:
- triggers:
    - trigger: event
      event_type: system_log_event
      event_data:
        name: homeassistant.core
  variables:
    is_multicast: >
      {{ 'Unable to set value via multicast' in trigger.event.data.exception }}
    targets: >
      {% set find = '(?!.+__)(?!_)[\\da-z_]+(?<!_)\\.(?!_)[\\da-z_]+(?<!_)' %}
      {{ trigger.event.data.message | regex_findall(find) | list }}
    action: >
      {{ targets | select('search', 'turn_o(ff|n)') | list | first | default(none) }}
    entity_id: >
      {{ targets | reject('search', 'turn_o(ff|n)') | list }}
  conditions:
    - condition: template
      value_template: "{{ is_multicast }}"
  sensor:
    - name: Multicast Error
      unique_id: e9236ec7-1af0-4da8-8b27-255807e459b3
      device_class: timestamp
      state: >
        {{ trigger.event.time_fired }}
      attributes:
        data: "{{ trigger.event.data }}"
        action: "{{ action }}"
        entity_id: "{{ entity_id }}"

script:
  ######################################
  # Zwave Multicast Floor, Area, Label #
  ######################################

  get_light_endpoints:
    mode: parallel
    alias: Generate a list of entpoints
    fields: &fields
      floor:
        description: (Optional) - The floor to turn on/off
        selector:
          floor:
            multiple: True
      area:
        description: (Optional) - The area to turn on/off
        selector:
          area:
            multiple: True
      include:
        description: The label to find
        required: True
        selector:
          label:
            multiple: True
      exclude:
        description: (Optional) - The label to exclude
        selector:
          label:
            multiple: True
      level:
        description: (Optional) The brightness level, switches will be on if the level is greater than 0.
        example: 99
        selector:
          number:
            min: 0
            max: 255
    variables: &variables
      # These are set to variables then output to easily test in template editor.
      defined_floors: >
        {%- set defined_floors = [floor_id(floor)] if floor is string else floor | map('floor_id') | list if floor is defined else [] %}
        {{- defined_floors }}
      defined_areas: >
        {%- set defined_areas = [area] if area is string else area if area is defined else [] %}
        {{- defined_areas }}
      includes: >
        {%- set includes = [include] if include is string else include %}
        {{- includes }}
      excludes: >
        {%- set excludes = [exclude] if exclude is string else exclude if exclude is defined else [] %}
        {{- excludes }}
      multicast: True
      zwave_pct: >
        {#- Zwave max percentage is 99 for some reason. #}
        {%- set maximum = 99 %}
        {%- set zwave_pct = (level | default(0) | int(0) / 255 * maximum) | int %}
        {%- set zwave_pct = [ 0, zwave_pct ] | max %}
        {%- set zwave_pct = [ maximum, zwave_pct] | min %}
        {{- zwave_pct }}
      brightness_pct: >
        {#- Convert 0-99 to 0-100 #}
        {%- set brightness_pct = (zwave_pct / 99 * 100) | round | int %}
        {{- brightness_pct }}
      brightness_pot: >
        {#- Convert 0-99 to 0-255 #}
        {%- set brightness_pct = (zwave_pct / 99 * 255) | round | int %}
        {{- brightness_pct }}
      value: >
        {#- 0 == False, anything > 0 == True #}
        {%- set value = zwave_pct > 0 %}
        {{- value }}

      targeted_state: o{{ 'ff' if value else 'n' }}

      # This is done for now because parallel cannot be auto generated.
      # Add a new domain, and add a new parallel call for zwave and non zwave
      # service calls.
      # These configs assume the default endpoint is zero.  This may 
      # need to change when adding new domains.
      zwave:
        light:
          command_class: 38
          property: targetValue
          value: "{{ zwave_pct }}"
        switch:
          command_class: 37
          property: targetValue
          value: "{{ value }}"
      non_zwave:
        light:
          service: light.turn_o{{ 'n' if value else 'ff' }}
          data: >
            {{ dict(brightness_pct=brightness_pct) if value else {} }}
        switch:
          service: switch.turn_o{{ 'n' if value else 'ff' }}
          data: {}
      labeled: >
        {#- Get the list of entities that are labeled #}
        {%- set items = includes | map('label_entities') | sum(start=[]) %}
        {{- items | reject('in', excludes | map('label_entities') | sum(start=[])) | list if excludes else items }}
      in_area: >
        {#- Filter to a list of entities that will be checked for on/off #}
        {%- set ns = namespace(items=[]) %}
        {%- if defined_floors %}
          {%- set ns.items = ns.items + defined_floors | map('floor_areas') | sum(start=[]) | map('area_entities') | sum(start=[]) | list %}
        {%- endif %}
        {%- if defined_areas %}
          {%- set ns.items = ns.items + defined_areas | map('area_entities') | sum(start=[]) | list %}
        {%- endif %}
        {{ ns.items | unique | select('in', labeled) | list }}
      endpoints: >
        {#- Get endpoints that are setup in the system for unique zwave multicast calls. #}
        {%- set ns = namespace(items=[('endpoint_0',[('endpoint',0)])]) %}
        {%- for name in labels() | map('label_name') | select('search', '^(\{\"endpoint\": [0-9]\})$') %}
          {%- set ns.items = ns.items + [(name | label_id, (name | from_json).items() | list)] %}
        {%- endfor %}
        {%- set endpoints = dict.from_keys(ns.items) %}
        {%- set endpoint_entities = endpoints | map('label_entities') | sum(start=[]) %}
        {%- set ns.items = [] %}
        {% for domain, items in zwave.items() %}
          {%- set attributes = items.items() | list %}
          {%- set sub = namespace(items=[], non_zwave=[]) %}
          {%- for epname, eps in endpoints.items() %}
            {%- set zwave_integration = integration_entities('zwave_js') %}
            {%- set entities = (
              zwave_integration | select('match', '^({0}).'.format(domain)) | reject('in', endpoint_entities) | list
              if epname == 'endpoint_0' else
              label_entities(epname) | select('match', '^({0}).'.format(domain)) | list
            ) -%}
            {%- set non_zwave_targets = sub.non_zwave + in_area | select('match', '^({0}).'.format(domain)) | reject('in', zwave_integration) | list %}
            {#- Filter down to entities that are selected by the areas #}
            {%- set zwave_targets = entities | select('in', in_area) | list %}
            {# if we are on lights, we need to check the brightness for targeted states #}
            {%- if domain == 'light' and targeted_state == 'off' %}
              {# Check non-zwave entities for matching brightness #}
              {%- set target_check = non_zwave_targets | reject('is_state_attr', 'brightness', brightness_pot) | list %}
              {%- if target_check | count > 0 %}
                {%- set sub.non_zwave = target_check %}
              {%- else %}
                {%- set sub.non_zwave = non_zwave_targets | select('is_state', targeted_state) | list %}
              {%- endif %}

              {# Check zwave entities for matching brightness #}
              {%- set target_check = zwave_targets | reject('is_state_attr', 'brightness', brightness_pot) | list %}
              {%- if target_check | count > 0 %}
                {%- set zwave_entities = target_check %}
              {%- else %}
                {%- set zwave_entities = zwave_targets | select('is_state', targeted_state) | list %}
              {%- endif %}
            {%- else %}
              {%- set sub.non_zwave = non_zwave_targets | select('is_state', targeted_state) | list %}
              {#- Filter down to entities that are selected by the areas #}
              {%- set zwave_entities = zwave_targets | select('is_state', targeted_state) | list %}
            {%- endif %}
            {%- set data = dict.from_keys(attributes + eps) %}
            {%- set sub.items = sub.items + [(epname, dict(data=data, entities=zwave_entities))] %}
          {%- endfor %}
          {%- set sub.items = sub.items + [('other', dict(entities=sub.non_zwave | unique | list, **non_zwave[domain]))] %}
          {%- set ns.items = ns.items + [(domain, dict.from_keys(sub.items))] %}
        {% endfor %}
        {{ dict.from_keys(ns.items) }}
    sequence:
    - stop: Stopping
      response_variable: endpoints

  get_light_entities:
    mode: parallel
    alias: Generate a list of light entities
    fields: *fields
    variables: 
      <<: *variables
      response: >
        {{ dict(entity_id=in_area) }}
    sequence:
    - stop: Stopping
      response_variable: response

  get_entities_from_light_group:
    mode: parallel
    alias: Generate a list of light entities from target lights
    fields:
      light:
        description: The entity to get entities from
        required: true
        selector:
          entity:
            filter:
            - domain: light
              integration: template
      
    variables:
      config:
        bonus_room: ['bonus_room', 'office', 'bonus_room_server_closet']
        master_suite: ['master_bathroom', 'master_bedroom', 'master_closet']
        great_room: ['79f87f3673464e84a683466dd6f7220d', 'dining_room', 'living_room']
        all: ['attached', 'basement', 'downstairs', 'upstairs', 'garage']
        inside: ['basement', 'downstairs', 'upstairs', 'garage']
        outside: ['attached']
      targets: "{{ light.split('.')[-1].split('_') }}"
      key: "{{ targets | first }}"
      slug: "{{ targets[1:] | join('_') }}"
      target: "{{ targets[1:] | map('title') | join(' ') }}"
      value: >
        {% set _target = config.get(slug) %}
        {% if _target is not none %}
          {{ _target }}
        {% else %}
          {{ area_id(target) }}
        {% endif %}
      data: >
        {% set items = [
          (key, value), ('include', 'target_light')
        ] %}
        {% if slug == 'great_room' %}
          {% set items = items + [('exclude', 'indoor_ambiance')] %}
        {% endif %}
        {{ dict.from_keys(items) }}
    sequence:
    - action: script.get_light_entities
      data: "{{ data }}"
      response_variable: response
    - stop: Stopping
      response_variable: response

  get_zwave_entities_from_light_group:
    mode: parallel
    alias: Generate a list of light entities from target lights
    fields:
      light:
        description: The entity to get entities from
        required: true
        selector:
          entity:
            filter:
            - domain: light
              integration: template
    sequence:
    - action: script.get_entities_from_light_group
      data:
        light: "{{ light }}"
      response_variable: lights
    - variables:
        response:
          entity_id: >
            {{ lights.entity_id | select('in', integration_entities('zwave_js')) | list }}
    - stop: Stopping
      response_variable: response

  light_handler:
    mode: parallel
    alias: Turn on/off lights and switches in parallel.
    fields: *fields
    variables: *variables
    sequence:
    - parallel:

      #########
      # LIGHT #
      #########

      # Endpoint 0
      - if: "{{ endpoints.light.endpoint_0.entities | count > 0 }}"
        then:
        - variables:
            info: "{{ endpoints.light.endpoint_0 }}"
        - <<: &zwave_service
            action: zwave_js.multicast_set_value
            target:
              entity_id: "{{ info.entities }}"
            data: "{{ info.data }}"

      # Endpoint 1
      - if: "{{ endpoints.light.endpoint_1.entities | count > 0 }}"
        then:
        - variables:
            info: "{{ endpoints.light.endpoint_1 }}"
        - <<: *zwave_service

      # Endpoint 2
      - if: "{{ endpoints.light.endpoint_2.entities | count > 0 }}"
        then:
        - variables:
            info: "{{ endpoints.light.endpoint_2 }}"
        - <<: *zwave_service

      # Everything else
      - if: "{{ endpoints.light.other.entities | count > 0 }}"
        then:
        - action: "{{ endpoints.light.other.service }}"
          target:
            entity_id: "{{ endpoints.light.other.entities }}"
          data: "{{ endpoints.light.other.data }}"

      ##########
      # SWITCH #
      ##########

      # Endpoint 0
      - if: "{{ endpoints.switch.endpoint_0.entities | count > 0 }}"
        then:
        - variables:
            info: "{{ endpoints.switch.endpoint_0 }}"
        - <<: *zwave_service

      # Endpoint 1
      - if: "{{ endpoints.switch.endpoint_1.entities | count > 0 }}"
        then:
        - variables:
            info: "{{ endpoints.switch.endpoint_1 }}"
        - <<: *zwave_service

      # Endpoint 2
      - if: "{{ endpoints.switch.endpoint_2.entities | count > 0 }}"
        then:
        - variables:
            info: "{{ endpoints.switch.endpoint_2 }}"
        - <<: *zwave_service

      # Everything else
      - if: "{{ endpoints.switch.other.entities | count > 0 }}"
        then:
        - action: "{{ endpoints.switch.other.service }}"
          target:
            entity_id: "{{ endpoints.switch.other.entities }}"
