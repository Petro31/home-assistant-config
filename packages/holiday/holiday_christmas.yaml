# Holiday Christmas: the Christmas-only lights. The Christmas tree (on the
# living room window outlet), the four WLED Christmas village effects on the
# kitchen cabinet accent strip (as lights that act like radio buttons), the
# front yard trees, and the Christmas outdoor bulb scene. Which holiday it is,
# and the indoor accent colors, come from holiday_lighting.yaml.
#
# Keep the holiday_ prefix on this filename, even though the folder repeats
# it. HA names a package after its filename alone (the folder is ignored),
# so a shorter name like lighting/scenes/christmas could silently clash with
# another package anywhere under packages/.
#
# External entities used:
#   MQTT (mqtt)
#     Front Yard: Garage Door Left Bulb (a601f2794fc36effc0cffb767485bd40)
#       light.garage_sconce_left_bulb
#     Front Yard: Garage Door Right Bulb (48540c549cff5acaa24779839108dc4e)
#       light.garage_sconce_right_bulb
#     Front Yard: Main Door Left Bulb (51abc464a490917f743e4db6d0866263)
#       light.main_door_left_bulb
#     Front Yard: Main Door Right Bulb (5f65fbf28117e47fb1e18d220107aac4)
#       light.main_door_right_bulb
#     Front Yard: Passenger Door Bulb (c891bf3c80ca54eb5e78fe78167e9f2b)
#       light.passenger_door_bulb
#     Front Yard: Uplight Left (a918c67ea821a0454a03d20d0357d1b7)
#       light.front_yard_uplight_left
#     Front Yard: Uplight Middle (57cdbc11d8edb45527be2ee453f90d5d)
#       light.front_yard_uplight_middle
#     Front Yard: Uplight Right (887f1338ee29de89beeb686df55f88e7)
#       light.front_yard_uplight_right
#   WLED (wled)
#     Game Room: Front Tree (e6825f7b5ff4d08f51bacc669da6296e) (config entry disabled outside the season)
#       select.front_tree_preset
#     Kitchen: Cabinet Accent (2a5e6cb86ca686b3bfd060de29831aba)
#       select.cabinet_accent_preset
#   Z-Wave JS (zwave_js)
#     Living Room: Window Outlet (a7d9ac16cae4a1e6ae0a7eb5bb9a226c)
#       switch.living_room_window
#
# Entities created by this package:
#   light.christmas_tree
#   light.christmas_blinking_houses
#   light.christmas_flashing_houses
#   light.christmas_red_and_green_houses
#   light.christmas_town_is_on_fire
#   switch.front_trees
#   scene.holiday_bulbs_christmas (no unique_id)

template:
- light:
  #################################
  ###      Christmas Tree       ###
  #################################

  - unique_id: christmas_tree
    name: Christmas Tree
    default_entity_id: light.christmas_tree
    state: >
      {{ is_state('switch.living_room_window', 'on') }}
    availability: >
      {{- expand('switch.living_room_window') | selectattr('state','in',['unavailable','unknown']) | list | length == 0 }}
    turn_on:
    - action: switch.turn_on
      target: &christmas_tree_switch
        entity_id: switch.living_room_window
    turn_off:
    - action: switch.turn_off
      target: *christmas_tree_switch

# To autogenerate WLED selects as 'radio buttons'

