- light:

    ########################################
    ###         Blinking Houses          ###
    ########################################
  
  - unique_id: christmas_blinking_houses
    name: Blinking Houses
    default_entity_id: light.christmas_blinking_houses
    variables:
      wled: select.cabinet_accent_preset
    state: >
      {{- is_state(wled, 'Blinking Houses') }}
    availability: >
      {{- wled | has_value }}
    turn_on:
    - <<: &christmas_blinking_houses_target
        action: select.select_option
        target: 
          entity_id: select.cabinet_accent_preset
      data:
        option: Blinking Houses
    turn_off:
    - <<: *christmas_blinking_houses_target
      data:
        option: All Off

    ########################################
    ###         Flashing Houses          ###
    ########################################
  
  - unique_id: christmas_flashing_houses
    name: Flashing Houses
    default_entity_id: light.christmas_flashing_houses
    variables:
      wled: select.cabinet_accent_preset
    state: >
      {{- is_state(wled, 'Flashing Houses') }}
    availability: >
      {{- wled | has_value }}
    turn_on:
    - <<: &christmas_flashing_houses_target
        action: select.select_option
        target: 
          entity_id: select.cabinet_accent_preset
      data:
        option: Flashing Houses
    turn_off:
    - <<: *christmas_flashing_houses_target
      data:
        option: All Off

    ########################################
    ###       Red and Green Houses       ###
    ########################################
  
  - unique_id: christmas_red_and_green_houses
    name: Red and Green Houses
    default_entity_id: light.christmas_red_and_green_houses
    variables:
      wled: select.cabinet_accent_preset
    state: >
      {{- is_state(wled, 'Red and Green Houses') }}
    availability: >
      {{- wled | has_value }}
    turn_on:
    - <<: &christmas_red_and_green_houses_target
        action: select.select_option
        target: 
          entity_id: select.cabinet_accent_preset
      data:
        option: Red and Green Houses
    turn_off:
    - <<: *christmas_red_and_green_houses_target
      data:
        option: All Off

    ########################################
    ###         Town is on Fire          ###
    ########################################
  
  - unique_id: christmas_town_is_on_fire
    name: Town is on Fire
    default_entity_id: light.christmas_town_is_on_fire
    variables:
      wled: select.cabinet_accent_preset
    state: >
      {{- is_state(wled, 'Town is on Fire') }}
    availability: >
      {{- wled | has_value }}
    turn_on:
    - <<: &christmas_town_is_on_fire_target
        action: select.select_option
        target: 
          entity_id: select.cabinet_accent_preset
      data:
        option: Town is on Fire
    turn_off:
    - <<: *christmas_town_is_on_fire_target
      data:
        option: All Off

- switch:
  # Front Trees
  - unique_id: front_trees
    name: Front Trees
    default_entity_id: switch.front_trees
    state: >
      {{ states('select.front_tree_preset') in state_attr('select.front_tree_preset', 'options') | reject('in', ['Match','Off','On']) | list }}
    turn_on:
    - action: select.select_option
      <<: &front_trees
        target:
          entity_id: select.front_tree_preset
      data:
        option: "{{ state_attr('select.front_tree_preset', 'options') | reject('in', ['Match','Off','On']) | list | random }}"
    turn_off:
    - action: select.select_option
      data:
        option: 'Off'
      <<: *front_trees

scene:
- name: Holiday Bulbs Christmas
  icon: mdi:string-lights
  entities:
    light.main_door_left_bulb:
      state: 'on'
      brightness: 255
      rgb_color: [179,   0,  12]
    light.main_door_right_bulb:
      state: 'on'
      brightness: 255
      rgb_color: [  0, 179,  44]
    light.passenger_door_bulb:
      state: 'on'
      brightness: 255
      rgb_color: [179,   0,  12]
    light.garage_sconce_left_bulb:
      state: 'on'
      brightness: 255
      rgb_color: [  0, 179,  44]
    light.garage_sconce_right_bulb:
      state: 'on'
      brightness: 255
      rgb_color: [179,   0,  12]
    light.front_yard_uplight_left:
      state: 'on'
      brightness: 255
      rgb_color: [179,   0,  12]
    light.front_yard_uplight_middle:
      state: 'on'
      brightness: 255
      rgb_color: [  0, 179,  44]
    light.front_yard_uplight_right:
      state: 'on'
      brightness: 255
      rgb_color: [179,   0,  12]
