# Calendar and milestone events: birthday and anniversary milestones (from
# custom_templates/dates.jinja) with same-day notifications and 30/14/7-day
# reminders, and the Lambosino's Random Events calendar turned into dashboard
# cards (filtered by the Event Category switches) with reminders 183 to 1 days
# ahead.
#
# External entities used:
#   Google Calendar (google)
#     calendar.lambosino_s_random_events
#   Dropdown helper (input_select, UI)
#     input_select.event_category
#   scripts/notifiers.yaml
#     script.notify
#
# Entities created by this package:
#   binary_sensor.personal_events
#   sensor.lambosino_s_random_events
#   switch.event_category_all
#   switch.event_category_vacation
#   switch.event_category_race
#   switch.event_category_work
#   switch.event_category_party
#   script.event
#   script.notify_events (called as the script.events action)

automation:
- alias: Events - Milestone Notifications
  id: event_milestone_notifications
  triggers:
    - trigger: time
      at: '10:00:00'
    - trigger: time
      at: '15:30:00'
    - trigger: time
      at: '19:00:00'
  variables:
    target_date: >
      {{ today_at().date() | string }}
    events: >
      {{ state_attr('binary_sensor.personal_events', 'events') | selectattr('when', 'eq', target_date) | list }}
  conditions:
  - condition: state
    entity_id: binary_sensor.personal_events
    state: 'on'
  actions:
  - repeat:
      for_each: "{{ events }}"
      sequence:
      - action: script.notify
        data:
          message: >
            Today is {{ repeat.item.who }}s {{ repeat.item.event }}!

- alias: Events - Milestone Reminders
  id: event_milestone_reminders
  triggers:
    - trigger: time
      at: '10:00:00'
    - trigger: time
      at: '15:30:00'
    - trigger: time
      at: '19:00:00'
  variables:
    target_dates: >
      {% set ns = namespace(dates=[]) %}
      {%- for offset in [30, 14, 7] %}
      {%- set ns.dates = ns.dates + [(today_at() + timedelta(days=offset)).date() | string] %}
      {%- endfor %}
      {{ ns.dates }}
    events: >
      {{ state_attr('binary_sensor.personal_events', 'events') | selectattr('when', 'in', target_dates) | selectattr('who', 'search', 'Mike|Lindsay') | list }}
  conditions:
  - condition: template
    value_template: "{{ events | count > 0 }}"
  actions:
  - repeat:
      for_each: "{{ events }}"
      sequence:
      - action: script.notify
        data:
          message: >
            {{ repeat.item.who }}s {{ repeat.item.event }} is in {{ repeat.item.days_away }} day{{ 's' if repeat.item.days_away > 1 else '' }}!

- alias: Events - Calendar Reminders
  id: event_calendar_reminders
  triggers:
    - trigger: time
      at: '19:00:00'
  actions:
  - action: script.events

script:
  event:
    alias: Event
    fields:
      card: 
        description: The timestamp format for persistent notifications & notifications.  Annoucements do not have a timestamp.
      notify: &notify_homeowners
        description: Devices to notify.
        example: notify.mobile_app_petro
        selector:
          select:
            options:
            - label: Petro
              value: notify.mobile_app_petro
            - label: Lambo
              value: notify.mobile_app_lindsays_iphone
            - label: Home Owners
              value: notify.homeowners
    variables:
      service_data:
        format: None
        title: >
          {{ card.primary | default('Unknown') }}
        message: >
          {{ card.secondary | default('Unknown') }}
        image: >
          {{ card.picture | default('local/images/home.jpg') }}
    sequence:
    - action: script.notify
      data: "{{ service_data }}"

  events:
    alias: Events
    fields:
      test: 
        description: Test days ahead
        example: 50
        selector:
          number:
            min: 0
            max: 730
            mode: box
      notify: *notify_homeowners
    variables:
      days_ahead: [183, 90, 60, 30, 14, 7, 1]
      targets: >
        {{ days_ahead + [ test ] if test is defined else days_ahead }}
      events: >
        {{ state_attr('sensor.lambosino_s_random_events', 'events') | selectattr('days', 'in', targets) | list }}
    sequence:
    - condition: template
      value_template: "{{ events | count > 0 }}"
    - repeat:
        for_each: "{{ events }}"
        sequence:
        - action: script.event
          data: 
            card: "{{ repeat.item.card }}"
            notify: "{{ notify | default }}"

template:
- binary_sensor:
  - name: Personal Events
    default_entity_id: binary_sensor.personal_events
    unique_id: personal_events
    state: >
      {% from 'dates.jinja' import dates %}
      {{ today_at().date() | string in dates() }}
    attributes:
      events: >
        {%- from 'dates.jinja' import events %}
        {%- from 'easy_time.jinja' import count_the_days %}
        {%- set ns = namespace(events=[]) %}
        {%- for event in events %}
          {%- set current = event.birth.replace(year=now().year) %}
          {%- set current = current if today_at() <= current else current.replace(year=current.year+1) %}
          {%- set milestone = (current - event.birth).days // 365 %}
          {%- set ns.events = ns.events + [ dict(milestone=milestone, days_away=count_the_days(current)|int, who=event.who, event=event.event, when=current.date()|string) ] %}
        {%- endfor %}
        {{- ns.events }}

- triggers:
  - trigger: time
    at: "00:00:00"
  - trigger: homeassistant
    event: start
  - trigger: event
    event_type: event_template_reloaded
  actions:
  - variables:
      calendar: calendar.lambosino_s_random_events
  - action: calendar.get_events
    data:
      start_date_time: "{{ today_at() }}"
      end_date_time: "{{ today_at().replace(year=now().year + 2, day=1, month=1) }}"
    target:
      entity_id: "{{ calendar }}"
    response_variable: raw_events
  - variables:
      gathered: >
        {{ {'events': raw_events[calendar].events} }}
      events: >
        {% set card_mod_fmat = '^--' %}
        {% set info = [
            {
               'find': 'disney',
               'category': 'vacation',
               'picture': 'local\\images\\disney_vacation.png',
               'badge_color': '#000000',
               'badge_icon': 'fapro:mickey'
            },
            {
               'find': 'vacation',
               'category': 'vacation',
               'picture': 'local\\images\\vacation.png',
               'badge_color': 'rgba(0,0,0,0)',
               'badge_icon': 'mdi:white-balance-sunny',
               '--icon-color': '#FDB813'
            },
            {
               'find': 'ultra',
               'category': 'race',
               'picture': 'local\\images\\ultra.png',
               'badge_color': '#000000',
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'trifecta',
               'category': 'race',
               'picture': 'local\\images\\trifecta.png',
               'badge_color': '#000000',
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'beast',
               'category': 'race',
               'picture': 'local\\images\\beast.png',
               'badge_color': '#000000',
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'super',
               'category': 'race',
               'picture': 'local\\images\\super.png',
               'badge_color': '#000000',
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'sprint',
               'category': 'race',
               'picture': 'local\\images\\sprint.png',
               'badge_color': '#000000',
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'trail',
               'category': 'race',
               'picture': 'local\\images\\mountains.png',
               'badge_color': '#4b371c',
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'marathon|half',
               'category': 'race',
               'picture': 'local\\images\\road.png',
               'badge_color': None,
               'badge_icon': 'mdi:run-fast'
            },
            {
               'find': 'conference',
               'category': 'work',
               'picture': 'local\\images\\expo.png',
               'badge_color': '#000000',
               'badge_icon': 'mdi:briefcase',
               '--icon-color': 'orange',
            },
            {
               'find': 'party',
               'category': 'party',
               'picture': 'local\\images\\party.png',
               'badge_color': None,
               'badge_icon': 'mdi:party-popper'
            },
            {
               'find': 'birthday',
               'category': 'party',
               'picture': 'local\\images\\party.png',
               'badge_color': '#024CB0',
               'badge_icon': 'mdi:cake-variant',
               '--icon-color': 'silver',
            },
            {
               'find': 'camping',
               'category': 'party',
               'picture': 'local\\images\\camping.png',
               'badge_color': 'rgba(0,0,0,0)',
               'badge_icon': 'mdi:weather-night',
               '--icon-color': '#F6F1D5'
            },
            {
               'find': 'wedding',
               'category': 'party',
               'picture': 'local\\images\\wedding.png',
               'badge_color': 'silver',
               'badge_icon': 'mdi:bell',
               '--icon-color': 'gold',
            },
            {
               'find': 'cruise',
               'category': 'vacation',
               'picture': 'local\\images\\cruise.png',
               'badge_color': 'rgba(0,0,0,0)',
               'badge_icon': 'mdi:ferry',
               '--icon-color': '#FDB813'
            },
            {
               'find': '_christmas_party',
               'category': 'party',
               'picture': 'local\\images\\christmas_party.png',
               'badge_color': '#c54245',
               'badge_icon': 'mdi:pine-tree'
            },
            {
               'find': '_halloween_party',
               'category': 'party',
               'picture': 'local\\images\\christmas_party.png',
               'badge_color': '#9119b3',
               'badge_icon': 'mdi:halloween',
               '--icon-color': 'black'
            },
        ] %}
        {% set days = {
            0: 'Today',
            1: 'Tomorrow'
        } %}
        {% set ns = namespace(items=[]) %}
        {% if gathered.events %}
          {% for event in gathered.events %}
            {% set inspect = event.summary.lower() %}
            {% set found = namespace(value={'picture': 'local\\images\\home_transparent_6.png', 'badge_icon': 'mdi:calendar-question', 'badge_color': 'rgba(0, 0, 0, 0)'}) %}
            {% for i in info if inspect is search(i.find) %}
              {% set found.value = i %}{% break %}
            {% endfor %}
            {% set found = found.value %}
            {% set date = event.start | as_datetime | as_local %}
            {% set end = event.end | as_datetime | as_local %}
            {% if found.find == 'party' and date.month == 10 %}
              {% set found = info | selectattr('find','eq','_halloween_party') | first %}
            {% elif found.find == 'party' and date.month == 12 %}
              {% set found = info | selectattr('find','eq','_christmas_party') | first %}
            {% endif %}
            {% set card_mod = dict(found.items() | list | selectattr('0', 'search', '^--') | list) %}
            {% if card_mod %}
              {% set styles = card_mod.items() | list | map('join',': ') | join('; ') ~ ';' %}
              {% set titems = found.items() | list | rejectattr('0', 'search', card_mod_fmat) | list + [
                ('card_mod', dict(style="mushroom-badge-icon {{{0}}}".format(styles))),
              ] %}
              {% set found = dict.from_keys(titems) %}
            {% endif %}
            {% set duration = (end - date).days %}
            {% set count = (date - today_at()).days %}
            {% set count = count if count > 0 else 0 %}
            {% if duration %}
              {% set phrase = duration | string ~ ' day event in %s days'%count %}
            {% elif date.minute %}
              {% set phrase = '%s event in %s days'%(date.strftime('%-I:%M %p'),count) %}
            {% else %}
              {% set phrase = '%s event in %s days'%(date.strftime('%-I %p'),count) %}
            {% endif %}
            {% set days_away = days.get(count, '\n'.join([phrase, date.strftime('%B %-d, %Y')])) %}
            {% set ns.items = ns.items + [{
                'event': event,
                'days': count,
                'card': dict(
                    type='custom:mushroom-template-card',
                    primary=event.summary,
                    secondary=days_away,
                    multiline_secondary=True,
                    **found
                )}
            ]  %}
          {% endfor %}
        {% else %}
          {% set ns.items = ns.items + [{'type': 'custom:mushroom-template-card', 'primary': "No Events", 'icon': 'mdi:calendar-alert-outline'}] %}
        {% endif %}
        {{ ns.items }}
  sensor:
  - name: Lambosino's Random Events
    default_entity_id: sensor.lambosino_s_random_events
    unique_id: lambosino_s_random_events
    state: "{{ now() }}"
    device_class: timestamp
    attributes:
      events: "{{ events }}"

- switch:
  - unique_id: event_category_all
    name: Event Category All
    default_entity_id: switch.event_category_all
    state: >
      {{ is_state('input_select.event_category', 'All') }}
    turn_on:
    - <<: &event_category
        action: input_select.select_option
        target:
          entity_id: input_select.event_category
      <<: &event_category_all
        data:
          option: All
    turn_off:
    - <<: *event_category
      <<: *event_category_all

  - unique_id: event_category_vacation
    name: Event Category Vacation
    default_entity_id: switch.event_category_vacation
    state: >
      {{ is_state('input_select.event_category', 'Vacation') }}
    turn_on:
    - <<: *event_category
      data:
        option: Vacation
    turn_off:
    - <<: *event_category
      <<: *event_category_all

  - unique_id: event_category_race
    name: Event Category Race
    default_entity_id: switch.event_category_race
    state: >
      {{ is_state('input_select.event_category', 'Race') }}
    turn_on:
    - <<: *event_category
      data:
        option: Race
    turn_off:
    - <<: *event_category
      <<: *event_category_all

  - unique_id: event_category_work
    name: Event Category Work
    default_entity_id: switch.event_category_work
    state: >
      {{ is_state('input_select.event_category', 'Work') }}
    turn_on:
    - <<: *event_category
      data:
        option: Work
    turn_off:
    - <<: *event_category
      <<: *event_category_all

  - unique_id: event_category_party
    name: Event Category Party
    default_entity_id: switch.event_category_party
    state: >
      {{ is_state('input_select.event_category', 'Party') }}
    turn_on:
    - <<: *event_category
      data:
        option: Party
    turn_off:
    - <<: *event_category
      <<: *event_category_all
