# Living room remote: switches for the Harmony activities and Roku apps,
# Chromecast workout videos, Chromecast play/pause/seek from the Harmony
# remote (through emulated Roku), and living room lights that follow Roku
# playback during movie time, and the Movie Time viewing scene.
#
# External entities used:
#   Emulated Roku (emulated_roku)
#     Home Assistant server: roku_command events from the Harmony remote (event, not an entity)
#   Google Cast (cast)
#     Living Room: Chromecast (6afc6f09c0d1228eca62f6127f80f042)
#       media_player.chromecast
#   Group (group, UI)
#     light.all_living_room
#     light.living_room
#   Logitech Harmony Hub (harmony)
#     Living Room: living_room (c00e43e3b3aa4b8bb7140258e5000a15)
#       remote.living_room (through the custom_templates/harmony.jinja macros)
#   Roku (roku)
#     Living Room: Roku (352883bfe3d0fe1eaab8ea16fb5f96c3)
#       media_player.roku_living_room
#   packages/living_room_harmony.yaml
#     script.harmony_activity_on
#     script.harmony_activity_off
#     script.harmony_all_off
#     script.roku_source_on
#   Z-Wave JS (zwave_js)
#     Dining Room: Chandelier (65e3c11152d87ef0475d41a5cdf3f9a4)
#       light.dining_room_chandelier
#     Kitchen: Cabinet (088f2d268e600b9dd69c385cf3a8b72c)
#       switch.kitchen_cabinet
#     Kitchen: Cans (c5e6c2e6836ebf64d58f9cf2743d6d00)
#       light.kitchen_cans
#     Kitchen: Island (8d9f9dc53f45c7fe4e73c6e2c08f81b4)
#       light.kitchen_island
#     Kitchen: Pantry Dome (f3754e5601df799c9cbe15f19cbbad4e)
#       switch.kitchen_pantry
#   packages/holiday_lighting.yaml
#     sensor.seasonal_accent_lights
#   packages/tv_ambient_lighting.yaml
#     switch.hyperion_usb_capture
#
# Entities created by this package:
#   switch.xbox_one
#   switch.playstation
#   switch.switch
#   switch.tv
#   switch.chromecast
#   switch.poweroff
#   switch.roku
#   switch.apple_tv
#   switch.netflix
#   switch.hbo
#   switch.hulu
#   switch.prime_video
#   switch.disney_plus
#   switch.plex
#   switch.peacock
#   switch.cast_workout_core
#   switch.cast_workout_cardio_kickboxing
#   switch.cast_workout_lower_body
#   switch.cast_workout_total_body
#   switch.cast_workout_upper_body
#   switch.movie_time
#   script.cast_workout_video
#   script.stop_casting

automation:
- alias: Give ChromeCast control to remote using emulated roku
  id: harmony_give_chromecast_control_to_remote_using_emulated_roku
  mode: restart
  triggers:
  - trigger: event
    event_type: roku_command
    event_data:
      source_name: Home Assistant
  variables:
    target: media_player.chromecast
    jump_in_seconds: 10
    key: >
      {{ trigger.event.data.key | default("NoPress") }}
    keys:
    # Mainly for my notes for the future, but unused.
    - Play
    - Rev
    - Fwd
    play_pause: "{{ key == 'Play' }}"
    rev: "{{ key == 'Rev' }}"
    fwd: "{{ key == 'Fwd' }}"
    rev_fwd: "{{ fwd or rev }}"
  conditions:
  - condition: template
    value_template: >
      {{ states(target) in ['playing', 'paused'] and key != 'NoPress' }}
  actions:
  - choose:
    # Play / Pause
    - conditions:
      - condition: template
        value_template: "{{ play_pause }}"
      sequence:
      - action: media_player.media_play_pause
        target:
          entity_id: "{{ target }}"

    # Reverse / Forward
    - conditions:
      - condition: template
        value_template: "{{ rev_fwd }}"
      sequence:
      - action: media_player.media_seek
        target:
          entity_id: "{{ target }}"
        data:
          seek_position: >
            {%- set current = state_attr(target, 'media_position') | default(0) %}
            {%- set total = state_attr(target, 'media_duration') | default(0) %}
            {%- set dir = 1 if fwd else -1 %}
            {%- set next = current + jump_in_seconds * dir %}
            {%- if fwd %}
              {{ total if next >= total else next }}
            {%- else %}
              {{ 0 if next <= 0 else next }}
            {%- endif %}
              

- alias: Play/Pause lighting in living room
  id: 0c371ea2-c700-476b-9c3d-b36bd3c9a662
  description: Turn on lighting when paused, turn off lighting when playing.
  triggers:
  - trigger: state
    entity_id: media_player.roku_living_room
    to:
    - playing
    - paused
    not_from:
    - unavailable
    - unknown
  variables:
    light: light.living_room
    media_state: "{{ trigger.to_state.state }}"
    light_state: "{{ 'on' if media_state == 'paused' else 'off' }}"
    movie_time: "{{ is_state('switch.movie_time', 'on') }}"
    turned_on_by_this: >
      {% if this.context.parent_id is not none %}
        {{ light | expand | selectattr('state', 'eq', 'on') | selectattr('context.parent_id', 'eq', this.context.parent_id) | map(attribute='entity_id') | list }}
      {% else %}
        []
      {% endif %}
    living_room_lights: >
      {% if movie_time and media_state == 'paused' and is_state(light, 'off') %}
        {{ state_attr(light, 'entity_id') }}
      {% elif movie_time and media_state == 'playing' and is_state(light, 'on') %}
        {{ turned_on_by_this }}
      {% else %}
        []
      {% endif %}
  conditions:
  - condition: template
    value_template: "{{ living_room_lights | length > 0 }}"
  actions:
  - action: light.turn_{{ light_state }}
    target:
      entity_id: "{{ living_room_lights }}"

script:
  cast_workout_video:
    alias: Workout Video
    mode: single
    fields:
      workout:
        description: (Required) Name of the workout.
        example: Core
        required: true
        selector:
          select:
            options:
            - Core
            - Cardio Kickboxing
            - Lower Body
            - Total Body
            - Upper Body
      chromecast:
        description: (Optional) The Chromecast media_player(s).
        example: media_player.chromecast
        required: false
        selector:
          entity:
            domain: media_player
            multiple: true
            integration: cast
    variables:
      media_player: "{{ chromecast | default('media_player.chromecast') }}"
      title: >
        {%- set titles = [
          'Core', 'Cardio Kickboxing', 'Lower Body', 'Total Body', 'Upper Body'
        ] %}
        {{ workout if workout in titles else 'NoTitle' }}
      content_id: >
        plex://{"library_name": "Workout Videos", "title": "{{ title }}"}
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ is_state('switch.chromecast', 'off') }}"
        sequence:
        - action: switch.turn_on
          target:
            entity_id: switch.chromecast

    - action: media_player.play_media
      target:
        entity_id: "{{ media_player }}"
      data:
        media_content_id: "{{ content_id }}"
        media_content_type: movie

  stop_casting:
    alias: Stop Casting
    mode: single
    sequence:
    - action: media_player.turn_off
      target:
        entity_id: media_player.chromecast

