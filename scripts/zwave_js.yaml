zwave_ping:
  mode: parallel
  alias: Ping nodes after x seconds
  fields:
    entities:
      description: (Required) The group of lights & switches
      example: group.bonus_room_area
      selector:
        entity:
          integration: zwave_js
          domain:
            - light
            - switch
          multiple: True
    delay:
      description: (Optional) How long from now you'll ping the nodes.
      example: 1
      selector:
        number:
          min: 0
          max: 300
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ delay is defined }}"
          sequence:
            - delay:
                seconds: "{{ delay }}"
    - action: zwave_js.ping
      target:
        entity_id: "{{ entities }}"

update_zwave:
  alias: Update Zwave devices in order
  mode: single
  variables:
    _integration: zwave_js
    message_title: "{{ _integration | replace('_', ' ') | title }}"
    entities: >
      {{ integration_entities(_integration) | select('search','^update') | select('is_state','on') | list }}
    message: >
      Updating firmware for household zwave sensors.

  sequence:
    - condition: template
      value_template: "{{ entities | length > 0 }}"
    - action: script.notify
      data:
        title: >
          {{ message_title }} Firmware Update
        message: "{{ message }}"
    - repeat:
        for_each: "{{ entities }}"
        sequence:
          - action: script.notify
            data:
              title: >
                {{ message_title }} Firmware Status
              message: Installing update for {{ device_name(repeat.item) }}
              notify: notify.mobile_app_petro
          - action: update.install
            target:
              entity_id: "{{ repeat.item }}"
